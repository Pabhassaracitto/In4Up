                   test/yt_ai_word_prompt_test.dart \
                   test/yt_read_aloud_sequence_test.dart \
                   test/yt_media_store_test.dart \
                   test/yt_download_filename_test.dart \
                   test/yt_tts_provider_collision_test.dart \
                   test/yt_one_bar_and_loop_test.dart \
                   test/yt_channels_and_prepare_test.dart \
                   test/yt_audit_v1_23_paint_pause_sync_test.dart \
                   test/yt_explorer_dot_a_2026_11_09_test.dart \
                   test/yt_explorer_dot_b_2026_11_09_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test YouTube audit trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          # -r expanded: mỗi test 1 dòng (compact reporter dùng \b khi
          # redirect, khó grep tên test fail).
          flutter test $files -r expanded > yt_audit_test.log 2>&1
          code=$?
          cat yt_audit_test.log
          # Đưa tên test fail + context lên annotation để tra cứu qua API
          # (log blob không tải được từ một số môi trường). Strip ANSI + \r
          # + \b trước vì dart test có thể in mã màu/ký tự tiến trình.
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
            yt_audit_test.log > yt_audit_clean.log || true
          grep -n "\[E\]" yt_audit_clean.log | cut -d: -f1 | while read -r ln; do
            msg=$(sed -n "${ln},$((ln + 22))p" yt_audit_clean.log \
              | head -c 900 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::TEST FAILED: $msg"
          done || true
          exit $code

      - name: Upload YouTube audit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-yt-audit-test-log
          path: yt_audit_test.log
          if-no-files-found: ignore

      # UI-ORDER-001 (owner 2026-10-25) — mặc định Đọc-trước-Nghe + migrate 1 lần.
      # BƯỚC GATE: chỉ file test THUẦN DART (không Hive/widget) ⇒ an toàn làm cổng.
      - name: "Shell order test — UI-ORDER-001 (Đọc trước Nghe, logic thuần)"
        id: shell-order-test
        timeout-minutes: 6
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          f=test/shell_content_order_test.dart
          if [ ! -f "$f" ]; then
            echo "Không có $f trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test "$f" -r expanded > shell_order_test.log 2>&1
          code=$?
          cat shell_order_test.log
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' shell_order_test.log > shell_order_clean.log || true
          grep -n "\[E\]" shell_order_clean.log | cut -d: -f1 | while read -r ln; do
            msg=$(sed -n "${ln},$((ln + 22))p" shell_order_clean.log \
              | head -c 900 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::TEST FAILED: $msg"
          done || true
          exit $code

      - name: Upload shell order test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-shell-order-test-log
          path: shell_order_test.log
          if-no-files-found: ignore

      # AUDIT-1.21.0-01 (owner 2026-11-06) — test THUẦN của đợt audit.
      # 2 file nằm trong test/screen_translate/ + test/cabin/ đã được 2 step cũ
      # chạy; 6 file còn lại nối riêng để link guard / endpoint / PDF preflight /
      # offline gate / loop presets / source-scan pin thực sự được CI chạy.
      - name: "AUDIT-1.21.0 — 6 file pure test + source-scan wiring pins"
        id: audit-1210-tests
        timeout-minutes: 8
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files="test/audit_1_21_0_wiring_test.dart \
            test/translation/translation_link_guard_test.dart \
            test/translation/deeplx_endpoint_audit_test.dart \
            test/pdf_reader/pdf_open_preflight_test.dart \
            test/services/offline_model_gate_test.dart \
            test/models/loop_presets_audit_test.dart"
          flutter test $files -r expanded > audit_1210_test.log 2>&1
          code=$?
          cat audit_1210_test.log
          if [ "$code" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
              audit_1210_test.log > audit_1210_clean.log || true
            grep -nE -B2 -A10 'Expected:|Actual:|\[E\]|Some tests failed|Exception|Error:' \
              audit_1210_clean.log | head -200 | while IFS= read -r line; do
              echo "::error title=AUDIT-1.21.0 test fail::$line"
            done || true
          fi
          exit $code

      - name: Upload AUDIT-1.21.0 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-audit-1-21-0-test-log
          path: audit_1210_test.log
          if-no-files-found: ignore

      # SAFE-INSET-001 (owner 2026-11-08) — chống thanh nội dung / bottom bar
      # chìm dưới thanh điều hướng hệ thống. Android 15 (targetSdk 35) ép
      # edge-to-edge; Flutter chỉ tự chừa cho `Scaffold.bottomNavigationBar`,
      # KHÔNG chừa cho thanh neo đáy tự dựng trong `Stack`/`Positioned`.
      # Test gồm: helper đơn vị + widget `BottomSafeArea` + quét nguồn 4 surface.
      # BATTERY-PROMPT-001 (owner 2026-11-09): "mở lên gặp 2 thông báo pin, tôi
      # muốn chỉ 1 và bấm vô là vào chỗ mở pin" + VOICE-CLONE-PERM-001 (chốt
      # việc 2 chỗ báo lỗi quyền micro phải KHÁC nhau — CI đã đỏ 2 lần vì bị
      # "sửa cả hai cho giống nhau").
      - name: "BATTERY-PROMPT + VOICE-CLONE-PERM — pin 1 thông báo & quyền micro tách nhánh"
        id: battery-voice-perm-tests
        timeout-minutes: 8
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files="test/services/battery_prompt_single_test.dart \
            test/tts/voice_clone_permission_split_test.dart"
          flutter test $files -r expanded > battery_voice_perm_test.log 2>&1
          code=$?
          cat battery_voice_perm_test.log
          if [ "$code" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
              battery_voice_perm_test.log > battery_voice_perm_clean.log || true
            grep -nE -B2 -A10 'Expected:|Actual:|\[E\]|Some tests failed|Exception|Error:' \
              battery_voice_perm_clean.log | head -200 | while IFS= read -r line; do
              echo "::error title=BATTERY-PROMPT/VOICE-CLONE-PERM fail::$line"
            done || true
          fi
          exit $code

      - name: Upload BATTERY-PROMPT + VOICE-CLONE-PERM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-battery-voice-perm-test-log
          path: battery_voice_perm_test.log
          if-no-files-found: ignore

      - name: "SAFE-INSET-001 — bottom bar không chìm dưới thanh điều hướng"
        id: safe-inset-tests
        timeout-minutes: 8
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files="test/system/bottom_nav_inset_test.dart"
          flutter test $files -r expanded > safe_inset_test.log 2>&1
          code=$?
          cat safe_inset_test.log
          if [ "$code" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
              safe_inset_test.log > safe_inset_clean.log || true
            grep -nE -B2 -A10 'Expected:|Actual:|\[E\]|Some tests failed|Exception|Error:' \
              safe_inset_clean.log | head -200 | while IFS= read -r line; do
              echo "::error title=SAFE-INSET-001 fail::$line"
            done || true
          fi
          exit $code

      - name: Upload SAFE-INSET-001 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-safe-inset-test-log
          path: safe_inset_test.log
          if-no-files-found: ignore

      # ⚠ KHÔNG nối `test/workspace_shell_integration_test.dart` vào CI (2026-10-25):
      # lần nối đầu (run 40229976121) nó TREO >8 phút ở `flutter test` (widget +
      # Hive) — dù đã bọc `timeout-minutes` + `--timeout` thì nó vẫn ăn hết ngân
      # sách job (25 phút) mà không cho tín hiệu dùng được. Bộ test này giữ để
      # chạy TAY trên máy dev; cổng CI cho quy tắc thứ tự là file thuần Dart ở
      # trên. Muốn nối lại: chạy `flutter test test/workspace_shell_integration_test.dart`
      # ở máy trước, sửa chỗ treo, rồi thêm bước gate.

  # Independent job: a failure or stalled gesture test must not skip the
  # existing app/locale regression suites above.
  vocabulary-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: "Vocabulary tools — graph, triangle and Venn regression tests"
        timeout-minutes: 3
        run: |
          set +e
          timeout -k 10s 150s flutter test \
            test/tools/vocabulary_visualization_layout_test.dart \
            test/tools/vocabulary_tools_interaction_test.dart \
            --timeout 45s -r expanded > vocabulary_tools_test.log 2>&1
          code=$?
          cat vocabulary_tools_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B3 -A8 'Expected:|Actual:|\[E\]|Exception|Error:' vocabulary_tools_test.log \
              | head -100 | while IFS= read -r line; do
                echo "::error title=Vocabulary tools test::$line"
              done
            tailmsg=$(tail -n 20 vocabulary_tools_test.log | head -c 3000 | sed 's/%/%25/g; :a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Vocabulary tools tests failed (exit $code)::${tailmsg:-No test output}"
          fi
          exit $code
      - name: Upload vocabulary tools test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-tools-test-log
          path: vocabulary_tools_test.log
          if-no-files-found: ignore

  # Covers the six-axis knowledge engine separately from existing app tests.
  knowledge-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: "Knowledge — independent skills, migration and six-axis tests"
        timeout-minutes: 6
        run: |
          set +e
          timeout -k 10s 5m flutter test test/knowledge --timeout 45s -r expanded > knowledge_test.log 2>&1
          code=$?
          cat knowledge_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B3 -A10 'Expected:|Actual:|\[E\]|Exception|Error:' knowledge_test.log \
              | head -120 | while IFS= read -r line; do
                echo "::error title=Knowledge test::$line"
              done
            tailmsg=$(tail -n 20 knowledge_test.log | head -c 3000 | sed 's/%/%25/g; :a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Knowledge tests failed (exit $code)::${tailmsg:-No test output}"
          fi
          exit $code
      - name: Upload knowledge test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-test-log
          path: knowledge_test.log
          if-no-files-found: ignore

  # Compilation only: never deploy or push gh-pages from this validation job.
  web-build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile web entrypoint without publishing
        timeout-minutes: 10
        run: |
          set +e
          flutter build web --release --base-href /In4Up/ -t lib/main_web.dart > web_build_test.log 2>&1
          code=$?
          tail -n 150 web_build_test.log
          if [ "$code" -ne 0 ]; then
            grep -m 15 -E 'Error|error|not available|Unsupported' web_build_test.log | while IFS= read -r line; do
              echo "::error title=Web build::$line"
            done
          fi
          exit "$code"
      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-validation-log
          path: web_build_test.log
          if-no-files-found: ignore
