name: App Analyze + Locale Test (wide oracle)

# Oracle rộng cho toàn app (lib/**) — bổ sung cho knowledge_tests.yml /
# soundlist_tests.yml (chỉ cover module hẹp).
#
# Chiến lược "chỉ sai khi ĐỎ THẬT": --no-fatal-infos --no-fatal-warnings
# → chỉ ERROR mới fail (codebase legacy có nhiều info-lint lịch sử —
# coi info là lỗi sẽ đỏ triền miên, không dùng làm oracle được).
# Log analyze upload thành artifact (GitHub App token không đọc được
# workflow log trực tiếp — tải artifact để đọc lỗi).
#
# Kèm 2 "máy bắt" chạy bằng flutter test:
#   - Rule 5 (AGENTS.md): chrome UI không tiếng Việt khi locale ≠ vi.
#   - Module Thuộc Lòng (LHB): SRS/cloze/ngôn ngữ + đồng bộ đa thiết bị
#     (LHB-006 — mốc LWW, bia mộ, hàng đợi pending, streak; thuần logic,
#     không cần mạng). Bước này tự bỏ qua nếu file test không có trên nhánh
#     (nhánh khác chưa merge) để không làm đỏ oracle dùng chung.
#
# Skill: docs/skills/ci-red-debugging/SKILL.md

on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'lib/**'
      - 'packages/in4up_ai/**'
      # PARAKEET-002: giải nén .tar.bz2 theo luồng nằm trong packages/in4up_stt.
      - 'packages/in4up_stt/**'
      - 'windows/**'
      - 'scripts/import_tipitaka.py'
      - '.gitmodules'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/app_analyze.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build_final_complete.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'packages/in4up_ai/**'
      # PARAKEET-002: giải nén .tar.bz2 theo luồng nằm trong packages/in4up_stt.
      - 'packages/in4up_stt/**'
      - 'windows/**'
      - 'scripts/import_tipitaka.py'
      - '.gitmodules'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/app_analyze.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build_final_complete.yml'
  workflow_dispatch:

jobs:
  analyze-and-locale-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Tipitaka importer join regression (Python)
        run: python3 test/test_import_tipitaka.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1' # khớp build.yml — tránh lệch dependency
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze full app (chỉ ERROR là fatal)
        id: analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          tail -n 300 analyze.log
          # Surface analyzer ERROR lines as GitHub annotations so they remain
          # retrievable through the check-runs API when artifact logs fail.
          if [ "$code" -ne 0 ]; then
            grep -E ' error •|^[[:space:]]*error' analyze.log | head -50 | while IFS= read -r line; do
              echo "::error title=Flutter analyzer::$line"
            done
          fi
          exit $code

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-analyze-log
          path: analyze.log
          if-no-files-found: ignore

      # LINUX-AUTH-001 — Home phải render được khi logger/sync/UI cùng
      # subscribe auth, và các primary tab phải đổi cả nội dung lẫn selected.
      # Chạy sớm, có timeout để lỗi plugin/provider không treo toàn bộ oracle.
      - name: "Linux shell tests — auth stream, Home và primary navigation"
        id: linux-shell-tests
        run: |
          set +e
          if [ ! -f test/linux_shell_regression_test.dart ]; then
            echo "Không có test Linux shell trên nhánh này — bỏ qua."
            exit 0
          fi
          timeout -k 10s 3m flutter test test/linux_shell_regression_test.dart \
            -r expanded > linux_shell_regression_test.log 2>&1
          code=$?
          cat linux_shell_regression_test.log
          exit $code

      - name: Wordlist playback and lazy tab regression tests
        run: flutter test test/wordlist_read_sequence_test.dart test/wordlist_playback_service_test.dart test/lazy_indexed_stack_test.dart

      - name: Upload Linux shell test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-shell-regression-test-log
          path: linux_shell_regression_test.log
          if-no-files-found: ignore

      - name: "DHRM-001 tests — pháp thoại: parser tên thật + catalog + tiến độ"
        id: dharma-tests
        timeout-minutes: 5
        run: |
          set +e
          if [ ! -f test/dharma/dharma_name_parser_test.dart ]; then
            echo "Không có test pháp thoại trên nhánh này — bỏ qua."
            exit 0
          fi
          timeout -k 10s 4m flutter test test/dharma/ -r expanded > dharma_test.log 2>&1
          code=$?
          cat dharma_test.log
          if [ "$code" -ne 0 ]; then
            tailmsg=$(tail -n 18 dharma_test.log | head -c 1800 | sed 's/%/%25/g; :a;N;$!ba;s/\n/%0A/g')
            echo "::error title=DHRM-001 test exit $code::${tailmsg:-No test output}"
          fi
          exit $code

      - name: Upload dharma test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dharma-test-log
          path: dharma_test.log
          if-no-files-found: ignore

      - name: "I4U18 tests — Video/Listen Library (logic thuần)"
        id: i4u18-lib-tests
        run: |
          set +e
          files="test/video_library_logic_test.dart test/subtitle_parser_test.dart test/video_ab_loop_state_test.dart test/video_ab_loop_wiring_test.dart test/audio_library_filters_test.dart test/audio_playlist_test.dart test/youtube_search_parser_test.dart test/yt_dlp_sidecar_test.dart test/yt_player_embed_test.dart test/yt_progressive_loading_test.dart"
          flutter test $files > i4u18_lib_test.log 2>&1
          code=$?
          cat i4u18_lib_test.log
          exit $code

      - name: Upload I4U18 lib test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-i4u18-lib-test-log
          path: i4u18_lib_test.log
          if-no-files-found: ignore

      - name: "PLAN-039 — listen queue, playback races, data and controls"
        id: listen-queue-tests
        if: always() && steps.analyze.outcome != 'cancelled' && steps.analyze.outcome != 'skipped'
        timeout-minutes: 8
        run: |
          set +e
          timeout -k 10s 5m flutter test test/listen_playback_queue_test.dart \
            test/listen_player_queue_integration_test.dart \
            test/listen_queue_widget_test.dart test/listen_recent_queue_test.dart \
            test/listen_queue_i18n_test.dart test/listen_source_artifact_test.dart \
            test/audio_import_service_test.dart test/listen_lifecycle_guards_test.dart \
            test/karaoke_timing_test.dart test/karaoke_view_test.dart \
            test/karaoke_tabs_integration_test.dart test/lrc_editor_timing_test.dart \
            -r expanded > listen_queue_test.log 2>&1
          code=$?
          cat listen_queue_test.log
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' listen_queue_test.log > listen_queue_clean.log || true
          grep -n "\[E\]" listen_queue_clean.log | cut -d: -f1 | while read -r ln; do
            msg=$(sed -n "${ln},$((ln + 22))p" listen_queue_clean.log | head -c 1000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::PLAN-039 TEST FAILED: $msg"
          done || true
          if [ "$code" -ne 0 ]; then
            tailmsg=$(tail -n 18 listen_queue_clean.log | head -c 1800 | sed 's/%/%25/g; :a;N;$!ba;s/\n/%0A/g')
            echo "::error title=PLAN-039 test exit $code::${tailmsg:-No test output}"
          fi
          exit $code

      - name: Upload listen queue test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listen-queue-test-log
          path: listen_queue_test.log
          if-no-files-found: ignore

      # AVTOOL-002/003 (PLAN-047) — máy bắt cho công cụ media. Toàn bộ logic
      # nằm ở tầng THUẦN (argv builder, ước lượng dung lượng, đặt tên, dịch mốc
      # LRC, phân loại lỗi) ⇒ chạy được trên host VM, không cần thiết bị.
      - name: "AVTOOL tests — công cụ media (argv/cắt/tách/LRC/lỗi)"
        id: media-tools-tests
        run: |
          set +e
          if [ ! -d test/media_tools ]; then
            echo "Không có test/media_tools trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test test/media_tools > media_tools_test.log 2>&1
          code=$?
          cat media_tools_test.log
          # Dua ten test that bai len ANNOTATION: artifact log hay bi chan tai
          # trong moi truong agent, con annotation thi luon doc duoc qua API.
          if [ $code -ne 0 ]; then
            # Artifact log KHONG tai duoc trong moi truong agent (blob host
            # ngoai allowlist) ⇒ dua nguyen doan cuoi log len annotation.
            # Message phai 1 dong va escape '%' theo cu phap workflow command.
            # Log chi tiet: dong co ten file test ma KHONG phai dau ✅ (tuc la
            # dong that bai / thong bao loi), kem ngu canh Expected/Actual.
            detail=$(grep -E "test/media_tools/[a-z_/]+\.dart:" media_tools_test.log \
              | grep -v "✅" | head -12 | tr '\n' '~' | sed 's/%/%25/g')
            echo "::error title=media_tools failing::$detail"
            expect=$(grep -E "Expected:|Actual:|Which:" media_tools_test.log \
              | head -12 | tr '\n' '~' | sed 's/%/%25/g')
            echo "::error title=media_tools detail::$expect"
          fi
          exit $code

      - name: Upload media tools test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-media-tools-test-log
          path: media_tools_test.log
          if-no-files-found: ignore

      - name: Rule 5 test — chrome UI không tiếng Việt (locale ≠ vi)
        id: locale-test
        run: |
          set +e
          files="test/locale_chrome_no_vietnamese_test.dart test/voice_clone_localization_test.dart"
          # SETTINGS-UI-COMPACT-001 / WHISPER-VARIANT-001 / PARAKEET-001:
          # nhãn mới trong màn Quản lý Model AI phải có key dịch (rule #5).
          if [ -f test/stt_model_settings_i18n_coverage_test.dart ]; then
            files="$files test/stt_model_settings_i18n_coverage_test.dart"
          fi
          flutter test $files > locale_test.log 2>&1
          code=$?
          cat locale_test.log
          exit $code

      - name: Upload locale test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-locale-test-log
          path: locale_test.log
          if-no-files-found: ignore

      # PARAKEET-002 — bộ giải nén .tar.bz2 theo luồng (thay `decodeBytes` nạp
      # cả archive vào RAM: import Parakeet ~487MB làm Android kill app).
      # Bỏ qua nếu nhánh chưa có file test.
      - name: "PARAKEET-002 tests — tar.bz2 stream extractor"
        id: tarbz2-stream-tests
        run: |
          set +e
          if [ ! -f test/tar_bz2_stream_extractor_test.dart ]; then
            echo "Không có test PARAKEET-002 trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test test/tar_bz2_stream_extractor_test.dart > tarbz2_stream_test.log 2>&1
          code=$?
          cat tarbz2_stream_test.log
          exit $code

      - name: Upload PARAKEET-002 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-tarbz2-stream-test-log
          path: tarbz2_stream_test.log
          if-no-files-found: ignore

      # DICT-CLEAN-001 / WORD-INSIGHT-001: làm sạch nội dung từ điển (bỏ
      # CSS/script/entity, khử nghĩa trùng) + waterfall tra nghĩa/IPA
      # (mạng → MDX → offline). Bỏ qua nếu nhánh chưa có file.
      - name: "DICT-CLEAN-001 / WORD-INSIGHT-001 tests"
        id: dict-word-insight-tests
        # ⚠ KHÔNG nối test WIDGET dùng plugin thật vào đây (run 40575300780:
        # `flutter test` của một testWidgets + sqflite/SharedPreferences TREO
        # tới hết ngân sách job 25 phút, giết cả run). Cùng lý do với
        # `workspace_shell_integration_test.dart` ở cuối file này. Hành vi của
        # màn Từ điển được phủ bằng test THUẦN (history) + test sqflite kiểu
        # `test()` (suggest/lookup) — hai loại này chạy ổn trên CI.
        timeout-minutes: 8
        run: |
          set +e
          files=""
          for f in test/dictionary/dict_text_cleaner_test.dart \
                   test/dictionary/dict_result_sheet_test.dart \
                   test/dictionary/dict_cleaner_noise_test.dart \
                   test/dictionary/dict_multilang_pos_test.dart \
                   test/dictionary/dict_state_and_title_test.dart \
                   test/dictionary/dict_history_test.dart \
                   test/dictionary/dict_suggest_test.dart \
                   test/dictionary/dict_deep_link_test.dart \
                   test/dictionary/dict_pack_test.dart \
                   test/dictionary/dict_sqlite_import_test.dart \
                   test/dict_bundle_scanner_test.dart \
                   test/i18n/dict_pack_and_word_pop_i18n_test.dart \
                   test/word_lookup/word_insight_service_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có test DICT-CLEAN-001/WORD-INSIGHT-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > dict_word_insight_test.log 2>&1
          code=$?
          cat dict_word_insight_test.log
          exit $code

      # Log của bước trên KHÔNG đọc được qua API (GitHub chỉ trả log qua blob
      # storage) ⇒ khi đỏ, đẩy phần đuôi log lên thành *annotation* của check-run
      # để còn đọc được bằng `gh api .../check-runs/<id>/annotations`.
      - name: "DICT tests — đưa lỗi lên annotation khi đỏ"
        if: always() && steps.dict-word-insight-tests.outcome != 'success'
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          log = pathlib.Path('dict_word_insight_test.log')
          if not log.exists():
              raise SystemExit(0)
          text = log.read_text(encoding='utf-8', errors='replace')[-6000:]
          escaped = (text.replace('%', '%25')
                         .replace('\r', '')
                         .replace('\n', '%0A'))
          print('::error title=dict-tests::' + escaped)
          PYEOF

      # PRON-001 (ADR-0015 D5) — gom 2 bản `_buildUrl()` YouGlish về
      # `YouGlishUrl.build` mà KHÔNG đổi hành vi: golden test sao chép nguyên văn
      # 2 hàm cũ và bắt chuỗi mới giống hệt trên ma trận từ × ngôn ngữ × accent,
      # + scan đảm bảo URL chỉ còn ở MỘT file. Thuần Dart (không plugin/mạng).
      - name: "PRON-001 tests — YouGlish URL golden + một nguồn sự thật"
        id: youglish-pron-tests
        run: |
          set +e
          files=""
          for f in test/youglish/youglish_url_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có test PRON-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files -r expanded > youglish_pron_test.log 2>&1
          code=$?
          cat youglish_pron_test.log
          exit $code

      # PRON-002: cùng nguyên tắc — CHỈ logic thuần + scan nguồn, không widget
      # test (plugin webview/Hive treo >8 phút trên runner, xem 4b4965f).
      - name: "PRON-002 tests — chính sách nguồn phát âm + ràng buộc surface"
        id: pron-002-tests
        run: |
          set +e
          files=""
          for f in test/youglish/pronunciation_source_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có test PRON-002 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          timeout 10m flutter test $files -r expanded > pron_002_test.log 2>&1
          code=$?
          cat pron_002_test.log
          exit $code

      - name: Upload PRON-002 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-pron-002-test-log
          path: pron_002_test.log
          if-no-files-found: ignore

      - name: Upload PRON-001 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-pron-youglish-test-log
          path: youglish_pron_test.log
          if-no-files-found: ignore

      - name: Upload DICT-CLEAN-001 / WORD-INSIGHT-001 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dict-word-insight-test-log
          path: dict_word_insight_test.log
          if-no-files-found: ignore

      - name: "READ-GRAM-001 tests — sentence structure"
        id: sentence-structure-tests
        run: |
          set +e
          files=""
          for f in test/sentence_structure_golden_test.dart \
                   test/sentence_structure_perf_test.dart \
                   test/read_sentence_structure_i18n_test.dart \
                   test/sentence_structure_language_gate_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test READ-GRAM-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > sentence_structure_test.log 2>&1
          code=$?
          cat sentence_structure_test.log
          exit $code

      - name: Upload READ-GRAM-001 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-sentence-structure-test-log
          path: sentence_structure_test.log
          if-no-files-found: ignore

      - name: "Tipiṭaka — import ngôn ngữ độc lập + Pāli enrich"
        run: >-
          flutter test
          test/tipitaka_independent_language_import_test.dart
          test/tipitaka_workspace_retention_test.dart
          test/tipitaka_dictionary_i18n_coverage_test.dart
          test/tipitaka_display_phase2_test.dart
          test/tipitaka_import_concurrency_test.dart
          test/tipitaka_catalog_tts_test.dart

      # IN4-15 (LOGIN-CRASH-002): đăng nhập release — guard cấu trúc cho
      # CI gate SHA-1 ↔ google-services.json + log trạng thái auth.
      - name: "Login release verification (IN4-15)"
        run: >-
          flutter test
          test/login_release_verification_test.dart

      # IN4-94 + IN4-83 (AI-PROV-BUILTIN-001): hết vạch vàng-đen overflow ở
      # màn "Sửa nhà cung cấp" + provider CÓ SẴN OpenRouter (bật, model mặc
      # định — PSRC-181: `openrouter/free`) + routing Chat → ưu tiên online +
      # OpenRouter + căn lề MỌI hàng của tab Đọc. Test thuần + source-scan
      # (không plugin, không mạng) nên chạy được trên CI.
      - name: "AI provider builtin + read alignment (2026-10-17)"
        run: >-
          flutter test
          test/ai_provider_builtin_and_read_align_test.dart

      # PSRC-181 + PSRC-182 (owner 2026-11-10): model mặc định của provider
      # có sẵn = `openrouter/free` (kèm migrate cấu hình cũ, KHÔNG ghi đè
      # model user tự chọn) + gói dịch offline ML Kit ĐÃ TẢI không còn hiện
      # nút "Tải về" (icon + chữ "Đã tải" xanh). Test thuần + source-scan
      # (không plugin, không mạng) nên chạy được trên CI.
      - name: "PSRC-181/182 — openrouter/free mặc định + gói ML Kit đã tải"
        id: psrc-181-182-tests
        timeout-minutes: 8
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |-
          set +e
          files="test/ai_openrouter_default_free_test.dart \
            test/translation/mlkit_pack_download_ui_test.dart"
          flutter test $files -r expanded > psrc_181_182_test.log 2>&1
          code=$?
          cat psrc_181_182_test.log
          exit $code

      - name: Upload PSRC-181/182 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-psrc-181-182-test-log
          path: psrc_181_182_test.log
          if-no-files-found: ignore

      # API-TRANS-MODEL-001 / MODEL-PICKER-001 / API-SYNC-001 / API-DIAG-001:
      # model dịch riêng, hòa giải cấu hình cloud (LWW + bia mộ), báo cáo
      # "AI đang chạy" theo loại mạng, và chạy thử THẬT qua transport giả.
      # Thuần logic (không mạng, không plugin) nên chạy được trên CI.
      - name: "API settings tests — model dịch + đồng bộ + AI đang chạy (2026-10-26)"
        id: api-settings-tests
        run: |
          set +e
          if [ ! -f test/ai_translation_model_and_sync_test.dart ]; then
            echo "Không có test API settings trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test test/ai_translation_model_and_sync_test.dart \
            > api_settings_test.log 2>&1
          code=$?
          cat api_settings_test.log
          exit $code

      - name: Upload API settings test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-api-settings-test-log
          path: api_settings_test.log
          if-no-files-found: ignore

