name: App Analyze + Locale Test (wide oracle)

# Oracle rộng cho toàn app (lib/**) — bổ sung cho knowledge_tests.yml /
# soundlist_tests.yml (chỉ cover module hẹp).
#
# Chiến lược "chỉ sai khi ĐỎ THẬT": --no-fatal-infos --no-fatal-warnings
# → chỉ ERROR mới fail (codebase legacy có nhiều info-lint lịch sử —
# coi info là lỗi sẽ đỏ triền miên, không dùng làm oracle được).
# Log analyze upload thành artifact (GitHub App token không đọc được
# workflow log trực tiếp — tải artifact để đọc lỗi).
#
# Kèm 2 "máy bắt" chạy bằng flutter test:
#   - Rule 5 (AGENTS.md): chrome UI không tiếng Việt khi locale ≠ vi.
#   - Module Thuộc Lòng (LHB): SRS/cloze/ngôn ngữ + đồng bộ đa thiết bị
#     (LHB-006 — mốc LWW, bia mộ, hàng đợi pending, streak; thuần logic,
#     không cần mạng). Bước này tự bỏ qua nếu file test không có trên nhánh
#     (nhánh khác chưa merge) để không làm đỏ oracle dùng chung.
#
# Skill: docs/skills/ci-red-debugging/SKILL.md

on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/app_analyze.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  analyze-and-locale-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1' # khớp build.yml — tránh lệch dependency
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze full app (chỉ ERROR là fatal)
        id: analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          tail -n 300 analyze.log
          # Surface analyzer ERROR lines as GitHub annotations so they remain
          # retrievable through the check-runs API when artifact logs fail.
          if [ "$code" -ne 0 ]; then
            grep -E ' error •|^[[:space:]]*error' analyze.log | head -50 | while IFS= read -r line; do
              echo "::error title=Flutter analyzer::$line"
            done
          fi
          exit $code

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: "I4U18 tests — Video/Listen Library (logic thuần)"
        id: i4u18-lib-tests
        run: |
          set +e
          files="test/video_library_logic_test.dart test/subtitle_parser_test.dart test/audio_library_filters_test.dart test/audio_playlist_test.dart"
          flutter test $files > i4u18_lib_test.log 2>&1
          code=$?
          cat i4u18_lib_test.log
          exit $code

      - name: Upload I4U18 lib test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-i4u18-lib-test-log
          path: i4u18_lib_test.log
          if-no-files-found: ignore

      - name: Rule 5 test — chrome UI không tiếng Việt (locale ≠ vi)
        id: locale-test
        run: |
          set +e
          flutter test test/locale_chrome_no_vietnamese_test.dart > locale_test.log 2>&1
          code=$?
          cat locale_test.log
          exit $code

      - name: Upload locale test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-locale-test-log
          path: locale_test.log
          if-no-files-found: ignore

      - name: "READ-GRAM-001 tests — sentence structure"
        id: sentence-structure-tests
        run: |
          set +e
          files=""
          for f in test/sentence_structure_golden_test.dart \
                   test/sentence_structure_perf_test.dart \
                   test/read_sentence_structure_i18n_test.dart \
                   test/sentence_structure_language_gate_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test READ-GRAM-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > sentence_structure_test.log 2>&1
          code=$?
          cat sentence_structure_test.log
          exit $code

      - name: Upload READ-GRAM-001 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-sentence-structure-test-log
          path: sentence_structure_test.log
          if-no-files-found: ignore

      - name: "Tipiṭaka — import ngôn ngữ độc lập + Pāli enrich"
        run: >-
          flutter test
          test/tipitaka_independent_language_import_test.dart
          test/tipitaka_workspace_retention_test.dart
          test/tipitaka_dictionary_i18n_coverage_test.dart
          test/tipitaka_display_phase2_test.dart

      # I4U18-READ-IPA-001 + I4U18-PDF-OCR-TTS-001 (Agent F): chế độ dòng của
      # Word, trọng tài timeout/cancel của OCR, máy trạng thái TTS của PDF.
      # PLAN-035 (PDF-OCR-002 + XLAT-SCR-001): thêm batch OCR PDF + dịch
      # trang (cùng họ thuần logic — recognizer/translator tiêm vào).
      # Thuần logic (không plugin, không mạng) nên chạy được trên CI.
      - name: "Agent F tests — line mode / OCR guard / PDF TTS + batch OCR + page translate"
        id: agent-f-tests
        run: |
          set +e
          files=""
          for f in test/read_mode/docx_line_mode_test.dart \
                   test/read_mode/read_line_hint_test.dart \
                   test/ocr/ocr_cancel_token_test.dart \
                   test/pdf_reader/pdf_text_layer_probe_test.dart \
                   test/pdf_reader/pdf_tts_machine_test.dart \
                   test/pdf_reader/pdf_batch_ocr_test.dart \
                   test/pdf_reader/pdf_page_translate_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test Agent F trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > agent_f_test.log 2>&1
          code=$?
          cat agent_f_test.log
          exit $code

      - name: Upload Agent F test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-agent-f-test-log
          path: agent_f_test.log
          if-no-files-found: ignore

      # OCR-SCAN-CRASH-001 (audit 2026-10-07): "Quét ảnh ▸ Chụp & quét tài
      # liệu" làm sập app. Máy bắt cho phần QUYẾT ĐỊNH của lớp an toàn —
      # precheck Google Play services/RAM trước khi mở máy quét, và trọng tài
      # phiên quét (activity bị huỷ / crash native ⇒ không treo im lặng).
      # Thuần Dart (kênh native được thay bằng seam `OcrNativeBridge.invoke`),
      # không cần thiết bị. Tự bỏ qua nếu nhánh chưa có file.
      - name: "OCR scan safety tests — OCR-SCAN-CRASH-001 (logic thuần)"
        id: ocr-scan-tests
        run: |
          set +e
          files=""
          for f in test/ocr/ocr_precheck_test.dart \
                   test/ocr/ocr_scan_guard_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có test OCR-SCAN-CRASH-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files -r expanded > ocr_scan_test.log 2>&1
          code=$?
          cat ocr_scan_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B4 -A6 'Expected:' ocr_scan_test.log \
              | head -100 | while IFS= read -r line; do
              echo "::error title=OCR scan safety test fail::$line"
            done
          fi
          exit $code

      - name: Upload OCR scan safety test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ocr-scan-test-log
          path: ocr_scan_test.log
          if-no-files-found: ignore

      # TTS-EDGE-001 (Edge Read Aloud — giao thức edge-tts) + WP4 (API-005
      # Server TTS): engine TTS thuần logic (http.Client giả, source-scan
      # pin đăng ký TtsService) — chạy được trên CI không cần mạng. Bỏ qua
      # nếu nhánh chưa có file (workflow dùng chung nhiều nhánh).
      - name: "TTS engine tests — Edge TTS + Server API (WP4)"
        id: tts-edge-tests
        run: |
          set +e
          files=""
          for f in test/edge_tts_engine_test.dart \
                   test/edge_voice_prefs_test.dart \
                   test/tts_cache_key_test.dart \
                   test/tts_api_wp4_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test engine TTS trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > tts_edge_test.log 2>&1
          code=$?
          cat tts_edge_test.log
          # Đẩy test hỏng thành annotation check-runs (đọc được qua
          # api.github.com khi blob log bị chặn — tiền lệ bước analyze).
          if [ "$code" -ne 0 ]; then
            grep -nE -B4 -A6 'Expected:' tts_edge_test.log \
              | head -100 | while IFS= read -r line; do
              echo "::error title=TTS engine test fail::$line"
            done
          fi
          exit $code

      - name: Upload TTS engine test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-tts-edge-test-log
          path: tts_edge_test.log
          if-no-files-found: ignore

      # XLAT-SCR-002 / XLAT-SCR-003 — Dịch màn hình toàn hệ thống (ADR-0011):
      # bbox OCR, quy đổi toạ độ capture→overlay, rowStride + hoán kênh R/B,
      # debounce, pipeline OCR→dịch, giao thức MethodChannel, và MÁY TRẠNG THÁI
      # QUYỀN (thiếu overlay / thiếu consent / sẵn sàng — XLAT-SCR-003: phần
      # Kotlin chưa có CI biên dịch nên mọi quyết định quyền đẩy sang Dart).
      # Thuần Dart (OCR/engine dịch được bơm giả) nên chạy được trên CI không
      # cần thiết bị.
      - name: "Screen translate tests — XLAT-SCR-002/003 (logic thuần)"
        id: screen-translate-tests
        run: |
          set +e
          if [ ! -d test/screen_translate ]; then
            echo "Không có test/screen_translate trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test test/screen_translate/ -r expanded > screen_translate_test.log 2>&1
          code=$?
          cat screen_translate_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B4 -A6 'Expected:' screen_translate_test.log \
              | head -100 | while IFS= read -r line; do
              echo "::error title=Screen translate test fail::$line"
            done
          fi
          exit $code

      - name: Upload screen translate test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screen-translate-test-log
          path: screen_translate_test.log
          if-no-files-found: ignore

      # READ-ACT-001 + XLAT-MIX-001 (audit bản 0.10.3): luật chọn đoạn cho 4
      # hành động của tab Đọc và bộ tách đoạn hỗn hợp ngôn ngữ. Thuần Dart,
      # không plugin/mạng. Tự bỏ qua nếu nhánh chưa có file.
      - name: "Read actions + mixed-language tests (logic thuần)"
        id: read-act-tests
        run: |
          set +e
          files=""
          for f in test/read_mode/read_text_action_runner_test.dart \
                   test/read_mode/word_range_selection_test.dart \
                   test/translation/mixed_language_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test READ-ACT-001 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files -r expanded > read_act_test.log 2>&1
          code=$?
          cat read_act_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B4 -A6 'Expected:' read_act_test.log \
              | head -100 | while IFS= read -r line; do
              echo "::error title=Read action test fail::$line"
            done
          fi
          exit $code

      - name: Upload read actions test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-read-act-test-log
          path: read_act_test.log
          if-no-files-found: ignore

      # UX shell contracts (C-00..C-31 + I18N-001) — bộ "máy bắt" của hợp đồng
      # UX shell, 24 file: C-30 responsive/accessibility + C-31 state preservation
      # là 2 bộ QA cross-cutting (C-30 có cả widget test đo nhãn/vùng chạm/bàn
      # phím); I18N-001 canh chrome shell ở locale ≠ vi (rule #5).
      # shared shell contracts, back/dismiss, safe-area/overlay policy, các
      # flow reader/remember/understand/watch/audio + C-31 state preservation QA
      # (docs/ux/41-state-preservation-qa.vi.md).
      # Toàn bộ đều là logic thuần Dart (đã rà import: chỉ flutter_test/in4up),
      # không plugin, không mạng. Tự bỏ qua file chưa có trên nhánh.
      - name: "UX shell contracts + C-31 state preservation (logic thuần)"
        id: ux-contract-tests
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files=""
          for f in test/state_preservation_qa_test.dart \
                   test/responsive_accessibility_qa_test.dart \
                   test/shell_chrome_i18n_coverage_test.dart \
                   test/i4u_shell_contracts_test.dart \
                   test/ux_quality_contract_test.dart \
                   test/back_dismiss_coordinator_test.dart \
                   test/shortcut_registry_test.dart \
                   test/safe_area_overlay_policy_test.dart \
                   test/mini_player_surface_state_test.dart \
                   test/semantic_anchor_resolver_test.dart \
                   test/reader_contextual_flow_test.dart \
                   test/reader_contextual_panel_state_test.dart \
                   test/reader_contextual_handoffs_test.dart \
                   test/reader_contextual_action_orchestrator_test.dart \
                   test/remember_flow_test.dart \
                   test/remember_workspace_state_test.dart \
                   test/understand_workspace_state_test.dart \
                   test/coach_flow_test.dart \
                   test/watch_mode_flow_test.dart \
                   test/watch_mode_state_test.dart \
                   test/audio_library_flow_test.dart \
                   test/audio_library_state_test.dart \
                   test/home_reader_shell_state_test.dart \
                   test/shell_content_order_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test UX contract trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files -r expanded > ux_contract_test.log 2>&1
          code=$?
          cat ux_contract_test.log
          if [ "$code" -ne 0 ]; then
            # Đưa tên test fail + context lên annotation (log blob không tải
            # được từ một số môi trường). Strip ANSI + \r + \b trước.
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
              ux_contract_test.log > ux_contract_clean.log || true
            # Chi tiết exception của `-r expanded` nằm TRƯỚC dòng [E] ⇒ cửa sổ
            # annotation phải lấy cả 30 dòng phía trước, không chỉ phía sau.
            grep -n "\[E\]" ux_contract_clean.log | cut -d: -f1 | while read -r ln; do
              start=$((ln > 30 ? ln - 30 : 1))
              msg=$(sed -n "${start},$((ln + 6))p" ux_contract_clean.log \
                | head -c 2600 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error::TEST FAILED: $msg"
            done || true
          fi
          exit $code

      - name: Upload UX contract + C-31 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ux-contract-test-log
          path: ux_contract_test.log
          if-no-files-found: ignore

      # VOCAB-MEDIA-003 (ADR-0013, audit 0.10.3 mục 2) — 1 hoặc 2 ảnh mỗi từ
      # (imageUrl2 additive: dữ liệu cũ vẫn mở được, promote khi xoá ảnh chính,
      # swap slot) + duyệt thư viện animation (parser endpoint tùy chỉnh +
      # MediaWiki Commons). Thuần Dart — không plugin/mạng/SharedPreferences.
      # Tự bỏ qua nếu nhánh chưa có file (workflow dùng chung nhiều nhánh).
      - name: "VOCAB-MEDIA-003 tests — 2 ảnh mỗi từ + thư viện animation (logic thuần)"
        id: vocab-media-tests
        run: |
          set +e
          files=""
          for f in test/vocab_two_images_test.dart \
                   test/vocab_animation_library_test.dart \
                   test/word_import_parser_image_url2_test.dart \
                   test/word_import_parser_image_url_test.dart \
                   test/memory_item_image_url_test.dart \
                   test/vocab_media_type_test.dart \
                   test/vocab_image_search_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test VOCAB-MEDIA-003 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files -r expanded > vocab_media_test.log 2>&1
          code=$?
          cat vocab_media_test.log
          if [ "$code" -ne 0 ]; then
            grep -nE -B4 -A6 'Expected:|Unhandled exception' vocab_media_test.log \
              | head -120 | while IFS= read -r line; do
              echo "::error title=VOCAB-MEDIA-003 test fail::$line"
            done
          fi
          exit $code

      - name: Upload VOCAB-MEDIA-003 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-vocab-media-test-log
          path: vocab_media_test.log
          if-no-files-found: ignore

      - name: "LHB tests — Thuộc Lòng: SRS/cloze/ngôn ngữ + đồng bộ (LHB-006)"
        id: lhb-tests
        run: |
          set +e
          files=""
          for f in test/learn_by_heart_test.dart \
                   test/learn_by_heart_cloze_test.dart \
                   test/learn_by_heart_language_test.dart \
                   test/learn_by_heart_sync_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test LHB trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          flutter test $files > lhb_test.log 2>&1
          code=$?
          tail -n 400 lhb_test.log
          exit $code

      - name: Upload LHB test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lhb-test-log
          path: lhb_test.log
          if-no-files-found: ignore

      - name: Cabin Save test (CABIN-SAVE-001)
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          flutter test test/cabin/ > cabin_test.log 2>&1
          code=$?
          cat cabin_test.log
          exit $code

      - name: Upload cabin test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-cabin-test-log
          path: cabin_test.log
          if-no-files-found: ignore

      # IMPORT-MODELS-001 — guard nhận diện model Zipformer khi import
      # (profile VI/EN, tokens VI viết hoa, guard streaming SIGABRT).
      - name: ASR routing + import detection test (IMPORT-MODELS-001)
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          if [ ! -f test/asr_model_routing_test.dart ]; then
            echo "Không có file test ASR routing trên nhánh này — bỏ qua."
            exit 0
          fi
          flutter test test/asr_model_routing_test.dart > asr_test.log 2>&1
          code=$?
          cat asr_test.log
          exit $code

      - name: Upload ASR test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-asr-test-log
          path: asr_test.log
          if-no-files-found: ignore

      - name: "I4U18 scanner tests — MODEL-IMPORT-001 + DICT-001"
        id: i4u18-scanner-tests
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files=""
          for f in test/model_bundle_scanner_test.dart \
                   test/dict_bundle_scanner_test.dart \
                   test/dictionary/dict_db_service_test.dart \
                   test/dictionary/dict_result_sheet_test.dart \
                   test/dictionary/mdx_parser_test.dart \
                   test/dictionary/dict_import_lookup_test.dart \
                   test/dictionary/dict_random_access_source_test.dart; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "Không có file test I4U18 trên nhánh này — bỏ qua."
            exit 0
          fi
          echo "Chạy:$files"
          # -r expanded: mỗi test 1 dòng (compact reporter dùng \b khi
          # redirect, khó grep tên test fail).
          flutter test $files -r expanded > i4u18_scanner_test.log 2>&1
          code=$?
          cat i4u18_scanner_test.log
          # Đưa tên test fail + context lên annotation để tra cứu qua API
          # (log blob không tải được từ một số môi trường). Strip ANSI + \r
          # + \b trước vì dart test có thể in mã màu/ký tự tiến trình.
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' \
            i4u18_scanner_test.log > i4u18_clean.log || true
          grep -n "\[E\]" i4u18_clean.log | cut -d: -f1 | while read -r ln; do
            msg=$(sed -n "${ln},$((ln + 22))p" i4u18_clean.log \
              | head -c 700 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::TEST FAILED: $msg"
          done || true
          exit $code

      - name: Upload I4U18 scanner test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-i4u18-scanner-test-log
          path: i4u18_scanner_test.log
          if-no-files-found: ignore
