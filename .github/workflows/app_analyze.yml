      # đã sửa: khung lượt <｜hy_User｜>/<｜hy_Assistant｜> (prompt), chẩn đoán
      # quant 2-bit bị chặn (probe), và phân hoạch chunk khi có khung lượt
      # (runtime). Thuần logic — không cần native lib, không cần model.
      - name: "Hy-MT tests — khung lượt + chẩn đoán model + chunk runtime"
        id: hymt-tests
        # Phải có gate như các bước test khác: thiếu `if:` ⇒ mặc định success()
        # ⇒ step bị SKIP khi bước analyze đỏ (analyze đỏ vì lỗi CÓ SẴN trên
        # base, không liên quan Hy-MT) và test Hy-MT không bao giờ chạy.
        if: always() && steps.analyze.outcome != 'cancelled'
        run: |
          set +e
          files=""
          for f in test/hymt_prompt_test.dart \
                   test/hymt_model_probe_test.dart \
                   test/hymt_engine_runtime_test.dart \
