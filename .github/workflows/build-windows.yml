name: Build Windows App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nhập số Version (Ví dụ: 1.4.0)'
        required: true
        type: string
        default: '1.4.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          # ✅ cache: false cho Windows vì hay lỗi cache
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean up old folders
        shell: bash
        run: |
          rm -rf lib/features/DeepLX || true
          rm -rf lib/features/deeplx || true

      # ✅ Tạo DLL mock + Firebase + Auth - lấy từ bản main đã chạy được
      - name: Pre-create Required Windows DLLs & Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "lib/services"
          New-Item -ItemType Directory -Force -Path "assets/whisper_models"
          New-Item -ItemType Directory -Force -Path "android/app"
          New-Item -ItemType Directory -Force -Path "windows/libs"

          # Mock DLL để tránh lỗi CMake PostBuild copy
          "Mock DLL" | Out-File -FilePath "windows/libs/ggml.dll"    -Encoding ascii
          "Mock DLL" | Out-File -FilePath "windows/libs/whisper.dll" -Encoding ascii

          # Mock google-services.json cho Android plugin scan
          '{"project_info":{"project_number":"123","project_id":"mock"},"client":[],"configuration_version":"1"}' |
            Out-File -FilePath "android/app/google-services.json" -Encoding utf8

          # auth_service.dart
          @'
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId =
                String.fromEnvironment('GOOGLE_DESKTOP_CLIENT_ID');
            Future<void> signOut() async { debugPrint('Sign out on CI'); }
            Future<dynamic> signInWithGoogle() async { return null; }
          }
          '@ | Out-File -FilePath "lib/services/auth_service.dart" -Encoding utf8

          # firebase_options.dart
          @"
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: '${{ secrets.FIREBASE_API_KEY_WINDOWS }}',
                appId: '${{ secrets.FIREBASE_APP_ID_WINDOWS }}',
                messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
                projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
                authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN_WINDOWS }}',
                storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET_WINDOWS }}',
              );
            }
          }
          "@ | Out-File -FilePath "lib/firebase_options.dart" -Encoding utf8

          Write-Host "✅ All Windows pre-build files created"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release --verbose \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      # ✅ Dùng bash zip như bản main - ổn định hơn PowerShell Compress-Archive
      - name: Zip Windows build
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          cd build/windows/x64/runner/Release
          zip -r "../../../../../VipSound-Windows-${VERSION}.zip" *
          echo "✅ Windows zip created"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: VipSound-Windows-*.zip

      - name: Push ZIP to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "VipSound-Windows-*.zip"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}