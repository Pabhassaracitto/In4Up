name: Flutter Full Build - Android, iOS, Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nhập số Version (Ví dụ: 1.4.0)'
        required: true
        type: string
        default: '1.4.0'
      build_android:
        description: 'Build Android APK?'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows App?'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'push' || inputs.build_android == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # TẠO FILE CHO ANDROID TRƯỚC BIÊN DỊCH
      - name: Create Real Firebase & Auth Files for Android Build
        shell: bash
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/auth_service.dart
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId = String.fromEnvironment('GOOGLE_WEB_CLIENT_ID');
            Future<void> signOut() async {}
            Future<dynamic> signInWithGoogle() async { return null; }
          }
          EOF
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(apiKey: '', appId: '', messagingSenderId: '', projectId: '');
            }
          }
          EOF

      - name: Decode google-services.json
        uses: timheuer/base64-to-file@v1
        with:
          encodedString: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
          fileName: 'google-services.json'
          fileDir: './android/app/'

      # BƯỚC 1: Build 3 bản phân tách như cũ
      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      # BƯỚC 2: Build thêm 1 bản GỘP TẤT CẢ (Universal APK)
      - name: Build Universal APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      # BƯỚC 3: Đổi tên cho cả bản tách và bản gộp
      - name: Rename All APKs
        run: |
          # Đổi tên 3 bản tách
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/VipSound-Android-armv7-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/VipSound-Android-arm64-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
             build/app/outputs/flutter-apk/VipSound-Android-x64-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.apk
          # Đổi tên bản gộp (Universal)
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/VipSound-Android-Universal-All-CPU-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/VipSound-Android-*.apk

      - name: Đẩy TẤT CẢ APK lên GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/VipSound-Android-*.apk"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows App
    if: ${{ github.event_name == 'push' || inputs.build_windows == true }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean up old folders
        shell: bash
        run: |
          rm -rf lib/features/DeepLX || true
          rm -rf lib/features/deeplx || true

      - name: Get dependencies
        run: flutter pub get

      # SỬA LỖI WINDOWS: Sử dụng PowerShell nguyên sinh để chắc chắn file được ghi xuống đĩa cứng vật lý
      - name: Create Real Firebase & Auth Files for Windows Build (PowerShell)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "lib/services"
          New-Item -ItemType Directory -Force -Path "assets/whisper_models"
          New-Item -ItemType Directory -Force -Path "android/app"
          
          # Sinh file mock json phòng hờ cấu hình plugin rà soát
          '{"project_info":{"project_number":"123","project_id":"mock"},"client":[],"configuration_version":"1"}' | Out-File -FilePath "android/app/google-services.json" -Encoding utf8
          
          # Sinh file auth_service.dart
          $authService = @'
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId = String.fromEnvironment('GOOGLE_DESKTOP_CLIENT_ID');
            Future<void> signOut() async { debugPrint('Sign out triggered on CI'); }
            Future<dynamic> signInWithGoogle() async { debugPrint('Sign in triggered on CI'); return null; }
          }
          '@
          $authService | Out-File -FilePath "lib/services/auth_service.dart" -Encoding utf8

          # Sinh file firebase_options.dart
          $firebaseOptions = @'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: '${{ secrets.FIREBASE_API_KEY_WINDOWS }}',
                appId: '${{ secrets.FIREBASE_APP_ID_WINDOWS }}',
                messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
                projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
                authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN_WINDOWS }}',
                storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET_WINDOWS }}',
              );
            }
          }
          '@
          $firebaseOptions | Out-File -FilePath "lib/firebase_options.dart" -Encoding utf8

      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release --verbose \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      - name: List files in Release folder
        shell: powershell
        run: Get-ChildItem -Path "build\windows\x64\runner\Release*"

      - name: Zip Windows build
        shell: powershell
        run: |
          $absolutePath = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release*"
          Compress-Archive -Path $absolutePath -DestinationPath VipSound-Windows-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: VipSound-Windows-*.zip

      - name: Đẩy ZIP Windows lên GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "VipSound-Windows-*.zip"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA (sideload)
    if: ${{ github.event_name == 'push' || inputs.build_ios == true }}
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # SỬA LỖI IOS 1: Ép cấu hình Podfile lên 15.0 TRƯỚC KHI thực hiện 'flutter pub get' để thỏa mãn FFmpeg
      - name: Pre-configure iOS Podfile Deployment Target
        run: |
          if [ -f ios/Podfile ]; then
            # Bỏ dấu comment (#) và ép dòng platform về bản 15.0 nếu tồn tại, hoặc thêm mới vào đầu file
            sed -i '' "s/# platform :ios, '9.0'/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
          fi

      - name: Get dependencies
        run: flutter pub get

      # SỬA LỖI IOS 2: Ghi đè toàn bộ Xcode Project Settings và vòng lặp bổ sung của Pods sang bản 15.0 công hiệu rộng
      - name: Force Upgrade iOS Deployment Target (Xcode Project Settings)
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            echo "post_install do |installer|" >> ios/Podfile
            echo "  installer.generated_projects.each do |project|" >> ios/Podfile
            echo "    project.targets.each do |target|" >> ios/Podfile
            echo "      target.build_configurations.each do |config|" >> ios/Podfile
            echo "        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'" >> ios/Podfile
            echo "      end" >> ios/Podfile
            echo "    end" >> ios/Podfile
            echo "  end" >> ios/Podfile
            echo "end" >> ios/Podfile
          fi

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO }}
        run: echo $GOOGLE_SERVICE_INFO | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r VipSound-iOS-${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: VipSound-iOS-*.ipa

      - name: Đẩy IPA lên GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "VipSound-iOS-*.ipa"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}