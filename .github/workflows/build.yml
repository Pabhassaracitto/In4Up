name: Flutter Full Build - Android, iOS, Windows
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nhập số Version (Ví dụ: 1.4.0)'
        required: true
        type: string
        default: '1.4.0'
      build_android:
        description: 'Build Android APK?'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows App?'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'push' || inputs.build_android == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # v3 chết ở bước này (run 34977536488, 2026-09-15: package 'tools' không còn) — dùng v4.
      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # TẠO FILE CHO ANDROID TRƯỚC BIÊN DỊCH.
      # KHÔNG ghi đè lib/services/auth_service.dart nữa: file thật đã nằm trong git
      # (không chứa secret — client secret đi qua --dart-define) và app dùng
      # `AuthService().authStateChanges` + `AppUser` (AUTH-LINUX-01); stub cũ thiếu 2
      # thành viên đó ⇒ compile đỏ ngay ở "Build Split APKs". Chỉ tạo khi file vắng.
      - name: Create Real Firebase & Auth Files for Android Build
        shell: bash
        run: |
          mkdir -p lib/services
          if [ ! -f lib/services/auth_service.dart ]; then
          cat << 'EOF' > lib/services/auth_service.dart
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId = String.fromEnvironment('GOOGLE_WEB_CLIENT_ID');
            Future<void> signOut() async {}
            Future<dynamic> signInWithGoogle() async { return null; }
          }
          EOF
          fi
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(apiKey: '', appId: '', messagingSenderId: '', projectId: '');
            }
          }
          EOF

      - name: Decode google-services.json
        uses: timheuer/base64-to-file@v1
        with:
          encodedString: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
          fileName: 'google-services.json'
          fileDir: './android/app/'

      # KÝ APK (CI-ANDROID-03): decode keystore từ secrets → android/key.properties
      # để Gradle ký release bằng KEY THẬT (user update đè được giữa các release).
      # Thiếu secret ⇒ chỉ warning, Gradle fallback ký DEBUG keystore (vẫn cài được).
      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci/android_prepare_signing.sh

      # BƯỚC 1: Build 3 bản phân tách — CHỈ flavor stable (com.in4up).
      # Không --flavor ⇒ Gradle build cả dev/beta: chậm gấp 3 (llama.cpp × 3 flavor × 3 ABI)
      # và chết ở processBetaReleaseGoogleServices khi secret thiếu client com.in4up.beta.
      - name: Build Split APKs
        run: |
          flutter build apk --release --flavor stable --split-per-abi --android-skip-build-dependency-validation \
            "--dart-define=FLAVOR=stable" \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      # BƯỚC 2: Build thêm 1 bản GỘP TẤT CẢ (Universal APK)
      - name: Build Universal APK
        run: |
          flutter build apk --release --flavor stable --android-skip-build-dependency-validation \
            "--dart-define=FLAVOR=stable" \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      # BƯỚC 3: Đổi tên cho cả bản tách và bản gộp.
      # Tên do Flutter 3.44.1 sinh (FlutterPlugin.kt): app<-abi>?<-flavor>?-<mode>.apk
      # ⇒ split: app-<abi>-stable-release.apk (ABI TRƯỚC, flavor SAU); universal: app-stable-release.apk
      - name: Rename All APKs
        run: |
          set -e
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          OUT=build/app/outputs/flutter-apk
          ls -la "$OUT"
          mv "$OUT/app-armeabi-v7a-stable-release.apk" "$OUT/in4up-Android-armv7-$TAG.apk"
          mv "$OUT/app-arm64-v8a-stable-release.apk"   "$OUT/in4up-Android-arm64-$TAG.apk"
          mv "$OUT/app-x86_64-stable-release.apk"      "$OUT/in4up-Android-x64-$TAG.apk"
          mv "$OUT/app-stable-release.apk"             "$OUT/in4up-Android-Universal-All-CPU-$TAG.apk"
          ls -la "$OUT"/in4up-Android-*.apk

      # LƯỚI AN TOÀN (CI-ANDROID-03): APK chưa ký ⇒ fail tại đây, KHÔNG đẩy lên Release.
      - name: Verify APKs are signed
        run: bash scripts/ci/android_verify_apk_signed.sh build/app/outputs/flutter-apk/in4up-Android-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/in4up-Android-*.apk

      - name: Đẩy TẤT CẢ APK lên GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/in4up-Android-*.apk"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows App
    if: ${{ github.event_name == 'push' || inputs.build_windows == true }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ⚡ CACHE FIREBASE C++ SDK ĐỂ CHẠY CI SIÊU TỐC (MỚI BỔ SUNG)
      - name: Cache Firebase C++ SDK
        id: cache-firebase
        uses: actions/cache@v4
        with:
          path: |
            C:/Users/runneradmin/.firebase_sdk_cache
            C:/Users/runneradmin/AppData/Local/Temp/firebase_cpp_sdk
          key: firebase-cpp-sdk-windows-v13.5.0

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean up old folders
        shell: bash
        run: |
          rm -rf lib/features/DeepLX || true
          rm -rf lib/features/deeplx || true

      - name: Pre-create Required Windows DLLs & Asset Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "lib/services"
          New-Item -ItemType Directory -Force -Path "assets/whisper_models"
          New-Item -ItemType Directory -Force -Path "android/app"
          New-Item -ItemType Directory -Force -Path "windows/libs"
          
          # Tạo DLL rỗng dạng Binary chuẩn thay vì chuỗi Text để tránh lỗi PE Header
          if (-not (Test-Path "windows/libs/ggml.dll")) { [System.IO.File]::WriteAllBytes("windows/libs/ggml.dll", [byte[]]@()) }
          if (-not (Test-Path "windows/libs/whisper.dll")) { [System.IO.File]::WriteAllBytes("windows/libs/whisper.dll", [byte[]]@()) }
          
          # Sinh file mock json phòng hờ cấu hình plugin rà soát
          '{"project_info":{"project_number":"123","project_id":"mock"},"client":[],"configuration_version":"1"}' | Out-File -FilePath "android/app/google-services.json" -Encoding utf8
          
          # Sinh file auth_service.dart
          $authService = @'
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId = String.fromEnvironment('GOOGLE_DESKTOP_CLIENT_ID');
            Future<void> signOut() async { debugPrint('Sign out triggered on CI'); }
            Future<dynamic> signInWithGoogle() async { debugPrint('Sign in triggered on CI'); return null; }
          }
          '@
          if (-not (Test-Path "lib/services/auth_service.dart")) { $authService | Out-File -FilePath "lib/services/auth_service.dart" -Encoding utf8 }

          # Sinh file firebase_options.dart
          $firebaseOptions = @'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: '${{ secrets.FIREBASE_API_KEY_WINDOWS }}',
                appId: '${{ secrets.FIREBASE_APP_ID_WINDOWS }}',
                messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
                projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
                authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN_WINDOWS }}',
                storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET_WINDOWS }}',
              );
            }
          }
          '@
          $firebaseOptions | Out-File -FilePath "lib/firebase_options.dart" -Encoding utf8

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release --verbose \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      # Nén thư mục Release CHUẨN của Flutter: build/windows/x64/runner/Release
      # ⚠ FIX zip chỉ vài KB: trước đây dùng
      #   Get-ChildItem -Path "build/windows/x64" -Recurse -Directory -Filter "Release" | Select-Object -First 1
      # Trong cây build của Flutter có NHIỀU thư mục tên "Release" (intermediate của
      # CMakeFiles/flutter/plugins, mỗi thư mục chỉ chứa vài file .obj/.lib/1 DLL).
      # Get-ChildItem duyệt cây theo thứ tự bảng chữ cái (CMakeFiles → flutter → plugins → runner)
      # nên "First 1" luôn nhặt phải thư mục rác đầu tiên, KHÔNG BAO GIỜ là runner/Release
      # nơi chứa app đầy đủ => zip chỉ vài KB.
      - name: Zip Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $VERSION_NAME = "${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          
          # Đích chuẩn của `flutter build windows --release` (BINARY_NAME = "in4up")
          $RELEASE_DIR = "build/windows/x64/runner/Release"
          if (-not (Test-Path (Join-Path $RELEASE_DIR "in4up.exe"))) {
            # Phòng hờ nếu Flutter đổi cấu trúc output: tìm thư mục thực sự chứa in4up.exe
            $exe = Get-ChildItem -Path "build/windows" -Recurse -Filter "in4up.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { $RELEASE_DIR = $exe.DirectoryName }
          }
          if (-not (Test-Path (Join-Path $RELEASE_DIR "in4up.exe"))) {
            Write-Host "##[error]Khong tim thay in4up.exe — output build Windows thieu hoac build chua thanh cong."
            exit 1
          }
          Write-Host "Dang nen thu muc: $RELEASE_DIR"
          Compress-Archive -Path "$RELEASE_DIR\*" -DestinationPath "in4up-Windows-$VERSION_NAME.zip" -Force

          # Kiểm soát chất lượng: zip quá nhỏ => bundle thiếu file => fail ngay, không phát hành rác
          $zip = Get-Item "in4up-Windows-$VERSION_NAME.zip"
          $sizeMB = [math]::Round($zip.Length / 1MB, 2)
          Write-Host "Kich thuoc zip: $sizeMB MB"
          if ($zip.Length -lt 10MB) {
            Write-Host "##[error]Zip chi $sizeMB MB (< 10 MB) — bundle Release khong day du!"
            exit 1
          }
          Get-ChildItem $RELEASE_DIR | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: in4up-Windows-*.zip

      - name: Đẩy ZIP Windows lên GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "in4up-Windows-*.zip"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA (sideload)
    if: ${{ github.event_name == 'push' || inputs.build_ios == true }}
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # BƯỚC 1: Ép cấu hình nền tảng trong file Podfile lên 15.0 cho các thư viện CocoaPods cũ
      - name: Pre-configure iOS Podfile Platform
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios.*/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/g" ios/Podfile
          fi

      # BƯỚC 2: Sửa file cấu hình Xcode của Runner, giải quyết lỗi Target 13.0 của SPM
      - name: Force Upgrade Xcode Project Deployment Target to 15.0
        run: |
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
            echo "Xcode project deployment target forced to 15.0 successfully."
          fi
      - name: Create Real Firebase & Auth Files for iOS Build
        shell: bash
        run: |
          mkdir -p lib/services
          if [ ! -f lib/services/auth_service.dart ]; then
          cat << 'EOF' > lib/services/auth_service.dart
          import 'package:flutter/foundation.dart';
          class AuthService {
            static const String googleClientId = String.fromEnvironment('GOOGLE_IOS_CLIENT_ID');
            Future<void> signOut() async {}
            Future<dynamic> signInWithGoogle() async { return null; }
          }
          EOF
          fi
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'mock',
                appId: 'mock',
                messagingSenderId: 'mock',
                projectId: 'mock',
                iosBundleId: 'com.in4up',
              );
            }
          }
          EOF
          echo "Đã tạo firebase_options.dart và auth_service.dart cho iOS."

      - name: Get dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO }}
        run: echo "$GOOGLE_SERVICE_INFO" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Inject dummy Development Team for unsigned build
        run: |
          PROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            # Inject DEVELOPMENT_TEAM giả vào tất cả build configurations
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = /DEVELOPMENT_TEAM = ABCDE12345;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = /g' "$PROJ"
            
            # Tắt code signing
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJ"
            sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' "$PROJ"
            
            echo "Đã inject DEVELOPMENT_TEAM giả và tắt codesign."
          fi
      - name: Build iOS (no codesign)
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          flutter build ios --release --no-codesign \
            "--dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}" \
            "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}" \
            "--dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}"

      - name: Create IPA
        run: |
          VERSION_NAME="${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "in4up-iOS-${VERSION_NAME}.ipa" Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: in4up-iOS-*.ipa

      - name: Đẩy IPA lên GitHub Release chung
        uses: ncipollo/release-action@v1
        with:
          artifacts: "in4up-iOS-*.ipa"
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}
          name: "Release ${{ github.event_name == 'push' && github.ref_name || inputs.version_name }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
