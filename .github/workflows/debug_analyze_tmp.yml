# TẠM THỜI — debug IN4-78/79 (xóa sau khi đọc được log analyze).
# Chạy flutter analyze và đẩy TOÀN BỘ log thành ::error annotation để đọc
# qua check-runs API (sandbox agent không reach được results-receiver).
name: Debug Analyze (TMP)

on:
  workflow_dispatch:

concurrency:
  group: debug-analyze-tmp
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze + echo log as annotation
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          echo "ANALYZE_EXIT=$code"
          # Strip ANSI rồi gộp log thành 1 annotation (log ~6KB, dưới limit)
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g; s/\x08//g' analyze.log > analyze_clean.log || true
          msg=$(head -c 60000 analyze_clean.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=analyze-log::EXIT=$code%0A$msg"
          tail -n 120 analyze_clean.log
