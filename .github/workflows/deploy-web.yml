name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app
        # GitHub chạy bash với `-e -o pipefail` ⇒ `grep` rỗng sẽ ABORT step
        # trước khi phát annotation ⇒ tắt `-e` trong step này.
        continue-on-error: true
        run: |
          set +e
          flutter build web --release --base-href /In4Up/ > build_web.log 2>&1
          code=$?
          {
            echo "### ❌ flutter build web — exit code $code"
            echo '```'
            head -50 build_web.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          msg=$(grep -m 8 -E "Error|error|not available|Unsupported" build_web.log | tr -d '\r' | cut -c1-200 | sed 's/%/%25/g' | sed 's/^/ /' | paste -sd' ~ ' -)
          echo "::error title=flutter build web failed::${msg:-exit code $code}" || true
          exit 0

      - name: Fail build web (báo lỗi rõ ràng)
        if: always()
        run: exit 1

      - name: Preserve Flutter's client-side routing on GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
