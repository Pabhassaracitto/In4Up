name: Deploy Flutter web to GitHub Pages

# Deploy bản WEB của In4Up lên GitHub Pages.
#
# QUAN TRỌNG (IN4-109 / WEB-BUILD-001):
#   * Build dùng ENTRYPOINT RIÊNG cho web: `lib/main_web.dart` (target -t).
#     App chính (`lib/main.dart`) dùng native: FFI (whisper/sherpa/
#     UltraTimeStretch) + đọc/ghi file ⇒ `dart:ffi`/`dart:io` KHÔNG có trên
#     web ⇒ build web đỏ với
#     "Error: Dart library 'dart:ffi' is not available on this platform."
#     (86 file reachable từ lib/main.dart dùng 2 thư viện đó.)
#   * Deploy bằng cách PUSH kết quả vào nhánh `gh-pages` (GIỮ NGUYÊN các file
#     sẵn có, vd `yt_embed.html` — wrapper YouTube đang chạy trên Pages).
#     KHÔNG dùng `actions/deploy-pages` để **không đổi nguồn Pages** (Pages
#     hiện deploy từ nhánh `gh-pages`; đổi sang "GitHub Actions" sẽ phá
#     wrapper YouTube).
on:
  push:
    branches:
      - main
      # Nhánh làm việc của owner ⇒ tự deploy khi có thay đổi (bỏ được
      # việc bấm "Run workflow" thủ công). Build lỗi ⇒ KHÔNG publish ⇒
      # Pages giữ nguyên bản tốt gần nhất.
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Debug nguồn web trước build
        run: |
          echo "### web/index.html nguồn (trước build)" >> "$GITHUB_STEP_SUMMARY"
          echo '```html' >> "$GITHUB_STEP_SUMMARY"
          grep -c "in4up-loader" web/index.html && echo "source has loader: YES" >> "$GITHUB_STEP_SUMMARY" || echo "source has loader: NO" >> "$GITHUB_STEP_SUMMARY"
          head -50 web/index.html >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "web/yt_embed.html v2 check: $(grep -c isValidId web/yt_embed.html || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          cat web/index.html | head -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::SRC $l"; done || true

      - name: Build web app
        # GitHub chạy bash với `-e -o pipefail` ⇒ `grep` rỗng sẽ ABORT step
        # trước khi phát annotation ⇒ tắt `-e` trong step này.
        id: build-web
        continue-on-error: true
        run: |
          set +e
          flutter build web --release --base-href /In4Up/ -t lib/main_web.dart > build_web.log 2>&1
          code=$?
          {
            echo "### flutter build web — exit code $code"
            echo '```'
            head -100 build_web.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" != "0" ]; then
            msg=$(grep -m 8 -E "Error|error|not available|Unsupported" build_web.log | tr -d '\r' | cut -c1-200 | sed 's/%/%25/g' | sed 's/^/ /' | paste -sd' ~ ' -)
            echo "::error title=flutter build web failed::${msg:-exit code $code}" || true
            exit 1
          fi
          echo "::notice title=flutter build web::build OK (main_web.dart.js)"
          echo "### build/web/index.html sau build" >> "$GITHUB_STEP_SUMMARY"
          echo '```html' >> "$GITHUB_STEP_SUMMARY"
          grep -c "in4up-loader" build/web/index.html && echo "build has loader: YES" >> "$GITHUB_STEP_SUMMARY" || echo "build has loader: NO" >> "$GITHUB_STEP_SUMMARY"
          head -60 build/web/index.html >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/web/index.html build/web/yt_embed.html build/web/.nojekyll 2>&1 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Dừng nếu build web lỗi
        # `outcome` = failure khi step build lỗi (dù continue-on-error) ⇒ chỉ
        # báo đỏ ĐÚNG lúc build hỏng, không đỏ nhầm khi build thành công.
        if: steps.build-web.outcome == 'failure'
        run: exit 1

      - name: Preserve Flutter's client-side routing on GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Thêm .nojekyll để Pages không chạy Jekyll (cần cho Flutter web)
        run: |
          touch build/web/.nojekyll
          echo "Đã tạo build/web/.nojekyll"

      - name: Kiểm tra artifact web
        run: |
          set -e
          test -f build/web/index.html || { echo "::error::thiếu build/web/index.html"; exit 1; }
          test -f build/web/.nojekyll || { echo "::warning::thiếu .nojekyll"; }
          # Tên file JS là do Flutter sinh ra theo target ⇒ tự nhận diện thay
          # vì hard-code (dễ vỡ khi đổi tên entrypoint).
          JS=$(ls build/web/*.dart.js 2>/dev/null | head -1 || true)
          if [ -z "$JS" ]; then
            echo "::error::không thấy file *.dart.js trong build/web — build web có thể chưa sinh ra JS"
            ls -1 build/web | head -30 | while IFS= read -r f; do echo "::notice::build/web/$f"; done
            exit 1
          fi
          echo "::notice::JS chính: $(basename "$JS")"
          ls -1 build/web | head -20 | while IFS= read -r f; do echo "::notice::build/web/$f"; done
          if [ -f build/web/flutter_bootstrap.js ]; then
            grep -q "$(basename "$JS")" build/web/flutter_bootstrap.js \
              || echo "::warning::flutter_bootstrap.js không nhắc $(basename "$JS") — trang có thể trắng sau khi deploy."
          fi
          # Kiểm tra loader mới (không trắng) — FAIL nếu thiếu để CI đỏ và thấy ngay
          if grep -q "in4up-loader" build/web/index.html; then
            echo "::notice title=loader OK::index.html có loader (đã fix trắng) — $(grep -c in4up-loader build/web/index.html) hit"
          else
            echo "::error title=loader missing::build/web/index.html thiếu in4up-loader — Flutter build không copy web/index.html!"
            echo "Nguồn web/index.html loader: $(grep -c in4up-loader web/index.html || echo 0)"
            echo "Build output head:"
            head -20 build/web/index.html | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::BUILD $l"; done || true
            exit 1
          fi
          if grep -q "isValidId" build/web/yt_embed.html; then
            echo "::notice title=yt v2 OK::yt_embed.html v2 present"
          else
            echo "::error title=yt old::build/web/yt_embed.html thiếu isValidId — chưa phải v2"
            exit 1
          fi
          test -f build/web/.nojekyll || { echo "::error::thiếu build/web/.nojekyll"; exit 1; }
          echo "OK: build/web có index.html + $(basename "$JS") + .nojekyll + loader + yt v2"

      - name: Upload debug artifact (index.html + main.dart.js head)
        uses: actions/upload-artifact@v4
        with:
          name: web-build-debug-${{ github.sha }}
          path: |
            build/web/index.html
            build/web/flutter_bootstrap.js
            build/web/yt_embed.html
            build/web/.nojekyll
          retention-days: 3
          if-no-files-found: warn

      - name: Publish to gh-pages (giữ nguyên file khác, vd wrapper YouTube)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pages
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          # `cp -r` KHÔNG --delete ⇒ file cũ (yt_embed.html) còn nguyên.
          # Nhưng lần này đảm bảo .nojekyll luôn có (Jekyll tắt).
          cp -r build/web/. /tmp/pages/
          # Đảm bảo .nojekyll tồn tại ngay cả khi build không tạo (phòng thủ)
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Debug sau khi add
          echo "::notice::gh-pages HEAD $(git rev-parse HEAD)"
          echo "::notice::after cp loader in /tmp/pages: $(grep -c in4up-loader /tmp/pages/index.html 2>/dev/null || echo 0) vs build: $(grep -c in4up-loader "$GITHUB_WORKSPACE/build/web/index.html" 2>/dev/null || echo 0)"
          echo "::notice::after cp yt v2 in /tmp/pages: $(grep -c isValidId /tmp/pages/yt_embed.html 2>/dev/null || echo 0) vs build: $(grep -c isValidId "$GITHUB_WORKSPACE/build/web/yt_embed.html" 2>/dev/null || echo 0)"
          echo "::notice::/tmp/pages .nojekyll $(ls -lh /tmp/pages/.nojekyll 2>&1 | head -1 | sed 's/%/%25/g')"
          git diff --cached --stat | head -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::DIFF $l"; done || echo "::notice::no diff stat"
          if git diff --cached --quiet; then
            echo "::notice::Không có thay đổi so với gh-pages — bỏ qua push."
            git status --porcelain | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::STATUS $l"; done || true
            echo "No diff — check why build output same as gh-pages"
          else
            echo "::notice::Có thay đổi — sẽ push"
            git diff --cached --stat | head -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::PUSH $l"; done || true
            git commit -m "Deploy web app In4Up (${{ github.sha }})"
            git push --force origin HEAD:gh-pages || git push origin HEAD:gh-pages
            echo "::notice::Đã push lên gh-pages"
          fi
          echo "::notice::--- file trên gh-pages ---"
          ls -1 | head -20 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice::FILE $l"; done || true
