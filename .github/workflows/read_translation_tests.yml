name: Read translation regression tests

# Audit v1.29.0 §6. Separate from the hub-owned app_analyze.yml; no build,
# publishing, provider credentials, model downloads or native engines.
on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'lib/features/translation/**'
      - 'lib/screens/read_mode/**'
      - 'lib/providers/text_provider.dart'
      - 'lib/core/language/**'
      - 'test/translation/**'
      - 'test/read_mode/**'
      - 'test/translation_*.dart'
      - 'test/llm_mt_engine_test.dart'
      - 'test/deeplx_engine_test.dart'
      - 'test/linux_shell_regression_test.dart'
      - 'test/yt_audit_2026_10_20_batch1_test.dart'
      - 'test/test_ci_failure_annotations.py'
      - 'scripts/ci/emit_failure_annotation.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/read_translation_tests.yml'
  pull_request:
    paths:
      - 'lib/features/translation/**'
      - 'lib/screens/read_mode/**'
      - 'lib/providers/text_provider.dart'
      - 'lib/core/language/**'
      - 'test/translation/**'
      - 'test/read_mode/**'
      - 'test/translation_*.dart'
      - 'test/llm_mt_engine_test.dart'
      - 'test/deeplx_engine_test.dart'
      - 'test/linux_shell_regression_test.dart'
      - 'test/yt_audit_2026_10_20_batch1_test.dart'
      - 'test/test_ci_failure_annotations.py'
      - 'scripts/ci/emit_failure_annotation.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/read_translation_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-translation-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check failure-log diagnostics
        run: python3 -m unittest discover -s test -p test_ci_failure_annotations.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # Audit v1.29.0 §6 — keep this lane separate from word/IPA changes.
      - name: "Audit 1.29.0 section 6 — Read translation, priority and fallback"
        id: read-translation-tests
        timeout-minutes: 6
        run: |
          set +e
          flutter test test/translation/engine_priority_test.dart \
            test/read_mode/translation_result_visibility_test.dart \
            test/read_mode/translation_ipa_integration_test.dart \
            test/read_mode/translation_blur_test.dart \
            test/translation_cache_engine_test.dart \
            test/translation_glossary_test.dart test/llm_mt_engine_test.dart \
            test/deeplx_engine_test.dart test/translation_source_language_test.dart \
            test/read_mode/psrc_237_role_swap_test.dart \
            test/read_mode/psrc_238_source_language_test.dart \
            test/translation/engine_sheet_layout_test.dart \
            test/yt_audit_2026_10_20_batch1_test.dart \
            test/linux_shell_regression_test.dart \
            --concurrency=1 -r expanded > read_translation_test.log 2>&1
          code=$?
          cat read_translation_test.log
          if [ "$code" -ne 0 ]; then
            # Reserve annotation capacity for the runner's own exit error;
            # include assertions both before and after each [E] marker.
            python3 scripts/ci/emit_failure_annotation.py read_translation_test.log "Read translation tests" 8
          fi
          exit $code

      - name: Upload Read translation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-translation-test-log
          path: read_translation_test.log
          if-no-files-found: ignore
