name: Soundlist Module Tests (Âm mục)

# CI nhẹ cho module Soundlist (Âm mục) — theo pattern knowledge_tests.yml.
# ⚠️ LƯU Ý: lệnh analyze/test phải là MỘT DÒNG hoặc dùng heredoc/tee; KHÔNG
#   dùng plain-scalar YAML nhiều dòng với dấu `\` (YAML fold → backslash+space
#   → bash dính path thành 1 tham số → lệnh sai → CI đỏ giả).
# ⚠️ Log được upload thành artifact (vì GitHub App token không đọc được
#   workflow log trực tiếp — blob URL bị chặn) — tải artifact để đọc lỗi.
# Skill liên quan: docs/skills/ci-red-debugging/SKILL.md

on:
  push:
    branches: ['arena/**']
    paths:
      - 'lib/models/sound_*.dart'
      - 'lib/models/vad_settings.dart'
      - 'lib/services/sound_auto_toc_service.dart'
      - 'lib/services/storage_service.dart'
      - 'lib/providers/soundlist_provider.dart'
      - 'lib/widgets/sound_mark_edit_sheet.dart'
      - 'lib/widgets/sound_auto_toc_dialog.dart'
      - 'lib/screens/listen_mode/widgets/soundlist_panel.dart'
      - 'lib/screens/tools/sound_list/**'
      - 'test/sound_auto_toc_test.dart'
      - '.github/workflows/soundlist_tests.yml'
  pull_request:
    paths:
      - 'lib/models/sound_*.dart'
      - 'lib/models/vad_settings.dart'
      - 'lib/services/sound_auto_toc_service.dart'
      - 'lib/services/storage_service.dart'
      - 'lib/providers/soundlist_provider.dart'
      - 'lib/widgets/sound_mark_edit_sheet.dart'
      - 'lib/widgets/sound_auto_toc_dialog.dart'
      - 'lib/screens/listen_mode/widgets/soundlist_panel.dart'
      - 'lib/screens/tools/sound_list/**'
      - 'test/sound_auto_toc_test.dart'
      - '.github/workflows/soundlist_tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1' # khớp build.yml — tránh lệch dependency
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Soundlist module
        id: analyze
        run: |
          set +e
          flutter analyze lib/models/sound_mark.dart lib/models/sound_chapter.dart lib/models/sound_transcript.dart lib/models/sound_loop_stat.dart lib/models/vad_settings.dart lib/services/sound_auto_toc_service.dart lib/providers/soundlist_provider.dart lib/widgets/sound_mark_edit_sheet.dart lib/widgets/sound_auto_toc_dialog.dart lib/screens/listen_mode/widgets/soundlist_panel.dart lib/screens/tools/sound_list test/sound_auto_toc_test.dart > analyze.log 2>&1
          code=$?
          cat analyze.log
          exit $code

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundlist-analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: Run Soundlist tests
        id: test
        run: |
          set +e
          flutter test test/sound_auto_toc_test.dart > test.log 2>&1
          code=$?
          cat test.log
          exit $code

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundlist-test-log
          path: test.log
          if-no-files-found: ignore
