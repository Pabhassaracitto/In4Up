name: VieNeu engine build (Android arm64)

# BETA-1.29.0 / lane L6 — chứng minh engine native VieNeu-TTS **thật sự biên dịch
# được** và `.so` có mặt trong APK.
#
# Vì sao cần workflow riêng:
#   * `app_analyze.yml` chỉ chạy Dart/analyze — KHÔNG build native.
#   * `build_final_complete.yml` chỉ chạy khi push tag release ⇒ lỗi CMake/NDK chỉ
#     lộ ra ở bước phát hành (quá muộn, và tốn cả 4 nền tảng).
#
# Chạy khi: đổi `native/tts_vieneu/**`, đổi gitlink `third_party/audio.cpp` hoặc
# `third_party/sea-g2p`, đổi CMake Android, hoặc bấm tay trên bất kỳ nhánh `arena/**`.

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'native/tts_vieneu/**'
      - 'third_party/audio.cpp'
      - 'third_party/sea-g2p'
      - '.gitmodules'
      - 'android/app/src/main/cpp/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/vieneu_engine_build.yml'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build libvieneu_tts.so + libaudiocpp.so + libsea_g2p_rs.so (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # audio.cpp / sea-g2p được PIN trong .gitmodules (gitlink), không theo main.
      # --depth 1 thử trước (nhanh); nếu GitHub không cho fetch đúng SHA thì clone đủ.
      - name: Init submodules (llama.cpp + audio.cpp + sea-g2p)
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- third_party/llama.cpp
          git submodule update --init --depth 1 -- third_party/audio.cpp third_party/sea-g2p \
            || git submodule update --init -- third_party/audio.cpp third_party/sea-g2p
          git -C third_party/audio.cpp log -1 --format='audio.cpp %h %s'
          git -C third_party/sea-g2p  log -1 --format='sea-g2p  %h %s'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Setup Rust + cargo-ndk
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Resolve NDK path
        run: |
          set -euo pipefail
          NDK_DIR="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR — $(grep Pkg.Revision "$NDK_DIR/source.properties")"

      - name: Toolchain versions (chẩn đoán)
        run: |
          rustc --version; cargo --version; cargo ndk --version || true
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/" || true

      # Kiểm crate có biên dịch được với C ABI trên HOST trước (nhanh, tách lỗi
      # crate khỏi lỗi cross-compile). Không dùng để đóng gói.
      - name: Host check SEA-G2P (capi) — tách lỗi crate khỏi lỗi NDK
        shell: bash
        run: |
          set +e
          cargo build --release --locked \
            --manifest-path third_party/sea-g2p/Cargo.toml \
            --no-default-features --features capi > /tmp/g2p_host.log 2>&1
          code=$?
          tail -30 /tmp/g2p_host.log
          if [ "$code" != "0" ]; then
            errs="$(python3 scripts/ci/emit_failure_annotation.py /tmp/g2p_host.log 25 20)"
            echo "::error title=SEA-G2P host build::${errs:-exit=$code}"
            exit "$code"
          fi

      # SEA-G2P là thư viện Rust (C ABI) — không có bản Android dựng sẵn, phải
      # cross-compile. Chép vào jniLibs để audio.cpp `dlopen` theo tên.
      - name: Build SEA-G2P (C ABI) cho arm64-v8a
        shell: bash
        run: |
          set +e
          mkdir -p android/app/src/main/jniLibs
          # cargo-ndk đọc `cargo metadata` từ THƯ MỤC HIỆN TẠI (không theo
          # --manifest-path) ⇒ phải cd vào crate rồi mới gọi; -o dùng đường
          # dẫn tuyệt đối để không phụ thuộc cwd.
          (
            cd third_party/sea-g2p
            cargo ndk -t arm64-v8a \
              -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs" \
              build --release --locked \
              --no-default-features --features capi
          ) > /tmp/g2p_build.log 2>&1
          code=$?
          tail -40 /tmp/g2p_build.log
          if [ "$code" != "0" ]; then
            errs="$(python3 scripts/ci/emit_failure_annotation.py /tmp/g2p_build.log 25 20)"
            echo "::error title=SEA-G2P build::${errs:-exit=$code}"
            exit "$code"
          fi
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - name: Prepare google-services.json (secret; fallback mock để build)
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "dùng secret ANDROID_GOOGLE_SERVICES_JSON"
          else
            # Plugin google-services ĐỎ nếu không có client khớp applicationId
            # ("No matching client found for package name 'com.in4up'") ⇒ mock
            # tối thiểu nhưng ĐÚNG hình dạng, chỉ để build được.
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mock-in4up",
              "storage_bucket": "mock-in4up.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": { "package_name": "com.in4up" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMY0000000000000000000000000000" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::thiếu secret ANDROID_GOOGLE_SERVICES_JSON — dùng mock đúng hình dạng (chỉ để build)"
          fi

      - name: flutter pub get
        run: flutter pub get

      # Debug: không AOT Dart (nhanh hơn nhiều) nhưng vẫn chạy CMake/NDK đầy đủ —
      # đúng thứ cần kiểm. Flavor `stable` bắt buộc (không flavor ⇒ build cả 3 flavor).
      - name: Build APK debug arm64 (biên dịch audio.cpp + wrapper + ggml)
        shell: bash
        run: |
          set +e
          flutter build apk --debug --flavor stable --target-platform android-arm64 2>&1 | tee /tmp/vieneu_build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "### VieNeu engine build — exit $code" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "What went wrong|^e: |error:|fatal error|CMake Error|undefined reference|cannot find|No matching client|Execution failed|> Task .*FAILED|ninja: build stopped|Caused by" /tmp/vieneu_build.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Đưa dòng lỗi GỐC lên annotation (log workflow/artifact bị chặn egress
            # từ sandbox ⇒ annotation là kênh DUY NHẤT đọc được lỗi). Script mã
            # hoá %0A đúng thứ tự — bản sed cũ để lọt newline thật nên GitHub chỉ
            # hiện dòng đầu ("What went wrong:").
            errs="$(python3 scripts/ci/emit_failure_annotation.py /tmp/vieneu_build.log 60 30)"
            echo "::error title=VieNeu engine build::${errs:-exit=$code}" || true
          fi
          exit "$code"

      - name: Verify .so trong APK
        run: |
          set -euo pipefail
          APK="$(ls build/app/outputs/flutter-apk/*.apk | head -1)"
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libvieneu_tts|libaudiocpp|libsea_g2p_rs)\.so' | tee /tmp/vieneu_libs.txt
          for lib in libvieneu_tts.so libaudiocpp.so libsea_g2p_rs.so; do
            grep -q "lib/arm64-v8a/$lib" /tmp/vieneu_libs.txt \
              || { echo "::error::Thiếu $lib trong APK"; exit 1; }
          done

      - name: Upload APK + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-engine-arm64
          path: |
            build/app/outputs/flutter-apk/*.apk
            /tmp/vieneu_build.log
            /tmp/g2p_host.log
            /tmp/g2p_build.log
          retention-days: 7
          if-no-files-found: ignore
