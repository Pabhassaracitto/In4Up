name: TEMP web build diagnostic (xoá sau khi chẩn đoán)

# Workflow TẠM để chẩn đoán lỗi `flutter build web` — đưa lỗi compiler ra
# annotation của run (đọc được qua API, không cần mở giao diện log).
on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app (capture errors)
        id: wb
        # continue-on-error + `set +e`: GitHub chạy bash với `-e -o pipefail`
        # ⇒ một `grep` rỗng sẽ ABORT step trước khi phát annotation.
        continue-on-error: true
        run: |
          set +e
          flutter build web --release --base-href /In4Up/ > build_web.log 2>&1
          code=$?
          {
            echo "### ❌ flutter build web — exit code $code"
            echo '```'
            head -50 build_web.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # 1 annotation duy nhất, đã sanitize (% -> %25, bỏ CR, 1 dòng)
          # 10 dong loi compiler dau tien, kem "file:line:col"
          msg=$(grep -m 10 -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" build_web.log | tr -d '\r' | cut -c1-190 | sed 's/%/%25/g' | sed 's/^/ /' | paste -sd' ~ ' -)
          echo "::error title=flutter build web — loi compiler::${msg:-exit code $code}" || true
          files=$(grep -oE "^[^ ]*\.dart" build_web.log | sort -u | tr -d '\r' | head -20 | paste -sd', ' -)
          echo "::error title=file bi lo::${files:-khong ro}" || true
          echo "::error title=so dong chua dart:io|dart:ffi::$(grep -cE 'dart:io|dart:ffi' build_web.log || true)" || true
          exit 0

      - name: Fail (để run hiện đỏ)
        if: always()
        run: |
          set +e
          echo "::error title=web build::Xem Step Summary để đọc log đầy đủ."
          exit 1
