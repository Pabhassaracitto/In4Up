# SDK/NDK: khi đặt ANDROID_SDK_ROOT (hoặc ANDROID_HOME) và ANDROID_NDK_HOME (hoặc NDK_HOME),
# android/settings.gradle.kts sẽ ghi đè sdk.dir / ndk.dir trong local.properties trước mỗi build.

# Tối ưu RAM và Garbage Collector cho hiệu suất cao
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX & Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Daemon, song song, caching (đường dẫn cache do init.gradle / GRADLE_USER_HOME quyết định)
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Timeout mạng (ms)
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
