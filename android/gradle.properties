# 1. Cấu hình RAM & JVM cho Gradle Daemon (Gộp dòng trùng & tăng RAM lên 6GB để đóng gói C++ cực nhanh)
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. Bật tính năng Build song song & Caching
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# 3. AndroidX & Bỏ qua cảnh báo SDK
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
kotlin.jvm.target.validation.mode=ignore

# 4. Tăng Timeout khi tải dependencies nặng (giữ nguyên của bạn)
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000