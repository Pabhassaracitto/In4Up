<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">In4Up — Inner Rise</title>
  <desc id="desc">Geometric I4U monogram with the number four becoming an upward arrow.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B43"/>
      <stop offset="0.55" stop-color="#081827"/>
      <stop offset="1" stop-color="#06111D"/>
    </linearGradient>
    <linearGradient id="rise" x1="194" y1="370" x2="286" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53D6BD"/>
      <stop offset="0.5" stop-color="#8AD9A5"/>
      <stop offset="1" stop-color="#F4C95D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(254 248) rotate(90) scale(220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FD1C5" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#F7F2E7" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  <path d="M72 395H450" stroke="#BDEDE3" stroke-opacity="0.10" stroke-width="2" stroke-linecap="round"/>

  <!-- I -->
  <g fill="none" stroke="#F7F2E7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 146H142M110 146V366M78 366H142"/>
  </g>

  <!-- 4 becomes the upward movement -->
  <g fill="none" stroke="url(#rise)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 366V137L168 278H304"/>
  </g>
  <path d="M252 84L211 143H293L252 84Z" fill="#F4C95D"/>

  <!-- U: open, receptive, upward-facing -->
  <path d="M334 158V278C334 336 356 366 394 366C432 366 454 336 454 278V158" fill="none" stroke="#F7F2E7" stroke-width="28" stroke-linecap="round"/>

  <!-- Four subtle learning beats -->
  <g fill="#53D6BD">
    <circle cx="203" cy="409" r="4" opacity="0.45"/>
    <circle cx="225" cy="409" r="4" opacity="0.62"/>
    <circle cx="247" cy="409" r="4" opacity="0.8"/>
    <circle cx="269" cy="409" r="4"/>
  </g>
</svg>
