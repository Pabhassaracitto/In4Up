name: Flutter Full Build - Android, iOS, Windows

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag: v1.0, v2.1, v.v.

jobs:
  # JOB 1: BUILD ANDROID APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest # Android có thể build trên Ubuntu (nhẹ và nhanh)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Android SDK
        run: |
          # Install Android SDK 36 + NDK (giữ 28.2 cho local dev Windows/Linux, cài thêm 27 cho plugin cần)
          # Bạn yêu cầu giữ 28.2.13676358 để không tốn băng thông tải lại
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" --install "ndk;27.0.11902837" --install "ndk;28.2.13676358" --install "cmake;3.22.1"
          echo "NDK 27 và 28.2 đã cài để tương thích cả local và CI"

      # ★ THÊM: Tạo lại file google-services.json từ Secret
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          # Tạo file từ secret
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          
          if [ -s android/app/google-services.json ] && [ $(stat -c%s "android/app/google-services.json") -gt 10 ]; then
            echo "✅ File google-services.json đã được tạo. Kích thước: $(stat -c%s "android/app/google-services.json") bytes."
            cat android/app/google-services.json | grep -o '"package_name": "[^"]*"' | sort | uniq
            # Copy file vào tất cả flavor directories để tránh lỗi No matching client found for com.in4up.beta
            for flavor in dev beta stable main; do
              mkdir -p android/app/src/$flavor
              cp android/app/google-services.json android/app/src/$flavor/google-services.json
              mkdir -p android/app/src/$flavor/release
              cp android/app/google-services.json android/app/src/$flavor/release/google-services.json
              mkdir -p android/app/src/$flavor/debug
              cp android/app/google-services.json android/app/src/$flavor/debug/google-services.json
            done
            mkdir -p android/app/src/release
            cp android/app/google-services.json android/app/src/release/google-services.json
            echo "✅ Đã copy google-services.json vào tất cả flavor dirs"
          else
            echo "❌ LỖI: File google-services.json KHÔNG hợp lệ. Kiểm tra lại Secret!"
            exit 1
          fi
          
          ls -R android/app/src | grep google-services.json || true

      - name: Build APK (stable only to avoid missing beta client if secret incomplete)
        run: flutter build apk --release --flavor stable --split-per-abi --android-skip-build-dependency-validation || flutter build apk --release --flavor stable

      - name: Rename APK
        run: |
          ls build/app/outputs/flutter-apk/
          # Try to find stable apk
          if [ -f build/app/outputs/flutter-apk/app-stable-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-stable-release.apk build/app/outputs/flutter-apk/in4up-Android-${{ github.ref_name }}.apk
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/in4up-Android-${{ github.ref_name }}.apk
          else
            # Fallback: rename first apk found
            first=$(ls build/app/outputs/flutter-apk/*.apk | head -n1)
            mv "$first" build/app/outputs/flutter-apk/in4up-Android-${{ github.ref_name }}.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/in4up-Android-*.apk

  # JOB 2: BUILD WINDOWS
  build-windows:
    name: Build Windows App
    runs-on: windows-latest # BẮT BUỘC dùng Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      # ★ THÊM: Đảm bảo xóa thư mục cũ nếu còn sót lại
      - name: Clean up old folders
        run: |
          if (Test-Path "lib/features/DeepLX") { Remove-Item "lib/features/DeepLX" -Recurse -Force }
          if (Test-Path "lib/features/deeplx") { Remove-Item "lib/features/deeplx" -Recurse -Force }

      # ★ THÊM: Xóa cache build cũ để tránh lỗi CMake lưu đường dẫn sai
      - name: Clean Build Cache
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --verbose

      - name: List files in Release folder
        shell: powershell
        run: Get-ChildItem -Path "build\windows\runner\Release\*"

      - name: Zip Windows build
        shell: powershell
        run: |
          $absolutePath = "${GITHUB_WORKSPACE}\build\windows\runner\Release\*"
          Compress-Archive -Path $absolutePath -DestinationPath in4up-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: in4up-Windows-*.zip

  # JOB 3: BUILD iOS IPA (cho sideload)
  build-ios:
    name: Build iOS IPA (sideload)
    runs-on: macos-latest # BẮT BUỘC dùng macOS runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r in4up-iOS-${{ github.ref_name }}.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: in4up-iOS-*.ipa

  # JOB 4: TẠO RELEASE VỚI TẤT CẢ FILE
  create-release:
    name: Create Release with all files
    needs: [build-android, build-windows, build-ios] # Đợi cả 3 job hoàn thành
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          echo "=== DANH SÁCH FILE ĐÃ TẢI VỀ ==="
          ls -R artifacts
          echo "================================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-zip/*.zip
            artifacts/ios-ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
