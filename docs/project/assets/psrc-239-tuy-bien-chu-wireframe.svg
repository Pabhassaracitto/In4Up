<text class="mut sm" x="604.0" y="504.0">Nhóm nút chung một viền = chọn 1 trong N (chọn thẳng, không xoay vòng).</text>
<rect class="swOn" x="440.0" y="530.0" width="42.0" height="24.0" rx="12"/>
