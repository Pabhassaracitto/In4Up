<rect class="chip" x="50.0" y="250.0" width="192.1" height="32.0" rx="8"/>
<circle cx="66.0" cy="266.0" r="6" class="ico"/>
<text class="t sm" x="78.0" y="270.0">Hướng dẫn đọc theo dòng</text>
<rect class="chip" x="250.1" y="250.0" width="121.3" height="32.0" rx="8"/>
<circle cx="266.1" cy="266.0" r="6" class="ico"/>
<text class="t sm" x="278.1" y="270.0">Chế độ Focus</text>
<text class="mut sm" x="50.0" y="310.0">Đồng bộ tự động</text>
<text class="dim xs" x="50.0" y="325.0">Tự cuộn theo dòng đang đọc; tắt để cuộn tay.</text>
<rect class="swOn" x="348.0" y="302.0" width="42.0" height="24.0" rx="12"/>
<circle cx="378.0" cy="314.0" r="8" class="knobOn"/>
<text class="warn xs" x="40.0" y="416.0">• «Độ khó»: bấm để XOAY VÒNG 4 chế độ màu —</text>
<text class="warn xs" x="40.0" y="432.0">   không thấy 3 lựa chọn còn lại.</text>
<text class="warn xs" x="40.0" y="448.0">• «Thông tin màu», «Màu IPA», «Chế độ Focus»:</text>
<text class="warn xs" x="40.0" y="464.0">   bật / tắt — chỉ đổi màu icon.</text>
<text class="warn xs" x="40.0" y="480.0">• «Bôi nhiều chữ»: bật / tắt, nhãn đổi theo trạng thái.</text>
<text class="warn xs" x="40.0" y="496.0">• «Hướng dẫn đọc theo dòng»: mở bảng khác —</text>
<text class="warn xs" x="40.0" y="512.0">   trông y như các nút bật / tắt.</text>
<text class="t h2" x="440.0" y="114.0">SAU · 360 px</text>
