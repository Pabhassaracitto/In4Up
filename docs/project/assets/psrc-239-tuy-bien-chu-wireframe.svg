<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="670" viewBox="0 0 1180 670" font-family="DejaVu Sans">
  <style>
    .t   { fill: #E8EDF7; }
    .mut { fill: #B9C3DA; }
    .dim { fill: #7F8DAB; }
    .ok  { fill: #7CD992; }
    .warn{ fill: #F2B56B; }
    .b   { font-weight: bold; }
    .h1  { font-size: 20px; font-weight: bold; }
    .h2  { font-size: 14px; font-weight: bold; }
    .sm  { font-size: 11.5px; }
    .xs  { font-size: 10.5px; }
    .screen { fill: #0F1526; stroke: #263250; stroke-width: 1.2; }
    .chip   { fill: #1B2440; stroke: #3A4870; stroke-width: 1; }
    .grp    { fill: #141C30; stroke: #3A4870; stroke-width: 1; }
    .sel    { fill: #2196F3; }
    .ico    { fill: none; stroke: #B9C3DA; stroke-width: 1.4; }
    .icoOn  { fill: #64B5F6; }
    .swOn   { fill: #6C63FF; }
    .swOff  { fill: #1B2440; stroke: #7F8DAB; stroke-width: 1.4; }
    .knobOn { fill: #FFFFFF; }
    .knobOff{ fill: #7F8DAB; }
  </style>
<rect width="1180" height="670" fill="#070B16"/>
<text class="t h1" x="40.0" y="44.0">PSRC-239 · WIREFRAME — cụm «Tùy biến chữ»: một quy ước điều khiển</text>
<text class="dim sm" x="40.0" y="66.0">Bản vẽ tay để owner duyệt hình dạng — KHÔNG phải ảnh chụp app. Kích thước chữ / khoảng cách thật do Flutter quyết định; cần xem trên máy.</text>
<line x1="40" y1="82" x2="1140" y2="82" stroke="#24304C" stroke-width="1"/>
<text class="t h2" x="40.0" y="114.0">TRƯỚC · 360 px</text>
<text class="dim xs" x="40.0" y="130.0">6 chip giống hệt nhau, làm 3 loại việc khác nhau</text>
<rect class="screen" x="40.0" y="140.0" width="360.0" height="250.0" rx="14"/>
<text class="dim xs" x="50.0" y="162.0">Tùy biến chữ</text>
<rect class="chip" x="50.0" y="170.0" width="82.6" height="32.0" rx="8"/>
<circle cx="66.0" cy="186.0" r="6" class="icoOn"/>
<text class="t sm" x="78.0" y="190.0">Độ khó</text>
<rect class="chip" x="140.6" y="170.0" width="127.7" height="32.0" rx="8"/>
<circle cx="156.6" cy="186.0" r="6" class="icoOn"/>
