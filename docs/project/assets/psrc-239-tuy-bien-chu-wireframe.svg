<text class="mut sm" x="604.0" y="588.0">Chip rời có mũi tên = mở một bảng khác.</text>
<text class="ok sm" x="40.0" y="630.0">Không đổi: hàm được gọi, nơi lưu, 3 lối vào dùng chung một cụm (ADR-0024 D1). Cụm cao hơn trước khoảng một hàng; panel dock vẫn cuộn được.</text>
