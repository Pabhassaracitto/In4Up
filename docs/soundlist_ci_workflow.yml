name: Soundlist Module Tests (Âm mục)

# CI nhẹ cho module Soundlist (Âm mục) + Audio Library (P1) — pattern knowledge_tests.yml.
# ⚠️ LƯU Ý QUAN TRỌNG:
# 1. Lệnh MỘT DÒNG (hoặc heredoc) — không dùng plain-scalar YAML nhiều dòng
#    với dấu `\` (YAML fold → backslash+space → lệnh sai).
# 2. MỌI bước (pub get / analyze / test) đều tee ra .log; khi CI đỏ, log được
#    commit vào `ci_reports/` NGAY TRÊN NHÁNH → agent đọc lỗi qua git (vì
#    workflow log/artifact bị chặn trong môi trường agent).
# 3. Commit report chỉ chạm `ci_reports/` — KHÔNG khớp paths filter → không
#    gây vòng lặp workflow.
# Skill liên quan: docs/skills/ci-red-debugging/SKILL.md

on:
  push:
    branches: ['arena/**']
    paths:
      - 'lib/models/sound_*.dart'
      - 'lib/models/audio_library_entry.dart'
      - 'lib/models/vad_settings.dart'
      - 'lib/services/sound_auto_toc_service.dart'
      - 'lib/services/audio_library_channel.dart'
      - 'lib/services/audio_library_service.dart'
      - 'lib/services/storage_service.dart'
      - 'lib/providers/soundlist_provider.dart'
      - 'lib/providers/audio_library_provider.dart'
      - 'lib/widgets/sound_mark_edit_sheet.dart'
      - 'lib/widgets/sound_auto_toc_dialog.dart'
      - 'lib/screens/listen_mode/widgets/soundlist_panel.dart'
      - 'lib/screens/listen_mode/widgets/audio_library_view.dart'
      - 'lib/screens/listen_mode/widgets/listen_library_screen.dart'
      - 'lib/screens/tools/sound_list/**'
      - 'test/sound_auto_toc_test.dart'
      - 'test/audio_library_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/**/pubspec.yaml'
      - 'android/app/src/main/kotlin/**'
      - '.github/workflows/soundlist_tests.yml'
  pull_request:
    paths:
      - 'lib/models/sound_*.dart'
      - 'lib/models/audio_library_entry.dart'
      - 'lib/models/vad_settings.dart'
      - 'lib/services/sound_auto_toc_service.dart'
      - 'lib/services/audio_library_channel.dart'
      - 'lib/services/audio_library_service.dart'
      - 'lib/services/storage_service.dart'
      - 'lib/providers/soundlist_provider.dart'
      - 'lib/providers/audio_library_provider.dart'
      - 'lib/widgets/sound_mark_edit_sheet.dart'
      - 'lib/widgets/sound_auto_toc_dialog.dart'
      - 'lib/screens/listen_mode/widgets/soundlist_panel.dart'
      - 'lib/screens/listen_mode/widgets/audio_library_view.dart'
      - 'lib/screens/listen_mode/widgets/listen_library_screen.dart'
      - 'lib/screens/tools/sound_list/**'
      - 'test/sound_auto_toc_test.dart'
      - 'test/audio_library_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/**/pubspec.yaml'
      - 'android/app/src/main/kotlin/**'
      - '.github/workflows/soundlist_tests.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1' # khớp build.yml — tránh lệch dependency
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        id: pubget
        run: |
          set +e
          flutter pub get > pubget.log 2>&1
          code=$?
          cat pubget.log
          exit $code

      - name: Analyze Soundlist + Audio Library
        id: analyze
        run: |
          set +e
          flutter analyze lib/models/sound_mark.dart lib/models/sound_chapter.dart lib/models/sound_transcript.dart lib/models/sound_loop_stat.dart lib/models/vad_settings.dart lib/models/audio_library_entry.dart lib/services/sound_auto_toc_service.dart lib/services/audio_library_channel.dart lib/services/audio_library_service.dart lib/providers/soundlist_provider.dart lib/providers/audio_library_provider.dart lib/widgets/sound_mark_edit_sheet.dart lib/widgets/sound_auto_toc_dialog.dart lib/screens/listen_mode/widgets/soundlist_panel.dart lib/screens/listen_mode/widgets/audio_library_view.dart lib/screens/listen_mode/widgets/listen_library_screen.dart lib/screens/tools/sound_list test/sound_auto_toc_test.dart test/audio_library_test.dart > analyze.log 2>&1
          code=$?
          cat analyze.log
          exit $code

      - name: Run Soundlist + Audio Library tests
        id: test
        run: |
          set +e
          flutter test test/sound_auto_toc_test.dart test/audio_library_test.dart > test.log 2>&1
          code=$?
          cat test.log
          exit $code

      - name: Upload logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundlist-logs
          path: |
            pubget.log
            analyze.log
            test.log
          if-no-files-found: ignore

      - name: Commit logs to repo (đọc qua git)
        if: failure()
        shell: bash
        run: |
          mkdir -p ci_reports
          cp pubget.log ci_reports/pubget.log 2>/dev/null || true
          cp analyze.log ci_reports/analyze.log 2>/dev/null || true
          cp test.log ci_reports/test.log 2>/dev/null || true
          if ls ci_reports/*.log >/dev/null 2>&1; then
            git config user.name "in4up-ci-bot"
            git config user.email "actions@users.noreply.github.com"
            git add ci_reports/
            git commit -q -m "ci(report): logs run ${{ github.run_id }}" || true
            git push origin HEAD:${GITHUB_REF_NAME} -q 2>&1 | tail -2 || echo "push report failed"
          fi
