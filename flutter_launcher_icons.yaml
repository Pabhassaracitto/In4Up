flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.svg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.svg"
    background_color: "#0D0D0D"
    theme_color: "#0D0D0D"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
    image_path: "assets/icons/app_icon.svg"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.svg"