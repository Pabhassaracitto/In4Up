name: vipsound_ai
description: AI Analysis module for Vipsound - Gemma/llama.cpp offline backend
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  vipsound_core:
    path: ../vipsound_core

  # FFI cho llama.cpp
  ffi: ^2.1.3

  # Stream & State
  rxdart: ^0.28.0

  # File operations
  path_provider: ^2.1.5
  file_picker: ^11.0.2

  # HTTP download (Tầng C)
  http: ^1.2.2

  # Network check

  connectivity_plus: ^6.1.4 #7.1.0    # Check network

  # Hash verify
  crypto: ^3.0.6

  # Settings storage — CHỈ KHAI BÁO 1 LẦN
  shared_preferences: ^2.3.5

flutter:
  assets:
    - assets/models/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0