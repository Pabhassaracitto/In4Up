name: vipsound_stt
description: Hybrid STT module for Vipsound - Native + Whisper AI engines
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  speech_to_text: ^7.3.0
  
  # Whisper - chỉ dùng trên mobile/macOS
  whisper_flutter_new: ^1.0.1
  
  # FFmpeg - chỉ dùng trên mobile
  ffmpeg_kit_flutter_new: ^4.1.0

  path_provider: ^2.1.4
  dio: ^5.4.0
  firebase_storage: 13.3.0
  path: ^1.9.0
  rxdart: ^0.28.0
  crypto: ^3.0.6
  
  # FFI cho Windows Whisper trực tiếp
  ffi: ^2.1.0
  platform: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0