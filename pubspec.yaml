name: ultra_music_player
description: Music Player with UltraTimeStretch Engine - Speed 0.05x to 10.0x

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio: ^0.9.39
  audio_session: ^0.1.21

  # FFI for Native C++ Engine
  ffi: ^2.1.3

  # File & Storage
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  # Utilities
  rxdart: ^0.28.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true