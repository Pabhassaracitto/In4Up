<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- IN4-78: wrapper hosted on GitHub Pages để iframe /embed/ bên trong có
     Referer thật (https://pabhassaracitto.github.io) — YouTube từ chối
     player không có Referer hợp lệ từ ~07/2025 (mã 153). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #yt{position:fixed;inset:0;width:100%;height:100%}
  #yt iframe{width:100% !important;height:100% !important}
  #err{display:none;position:fixed;inset:0;background:#000;color:#fff;
       font-family:sans-serif;font-size:14px;align-items:center;
       justify-content:center;text-align:center;padding:16px;z-index:9}
</style>
</head>
<body>
<div id="yt"></div>
<div id="err"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function() {
  var p = new URLSearchParams(location.search);
  var VIDEO_ID = p.get('videoId') || '';
  function post(msg) {
    try { if (window.YtSync) YtSync.postMessage(msg); } catch (e) {}
  }
  function showErr(code) {
    var el = document.getElementById('err');
    el.style.display = 'flex';
    el.textContent = 'YouTube player error ' + code + ' (IN4-78)';
    post('err:' + code);
  }
  // API surface cho app (Dart runJavaScript):
  window._in4upSeek = function(s) {
    try { window.player.seekTo(s, true); } catch (e) {}
  };
  window._in4upPause = function() {
    try { window.player.pauseVideo(); } catch (e) {}
  };
  window._in4upPlay = function() {
    try { window.player.playVideo(); } catch (e) {}
  };
  function tick() {
    try {
      if (window.player && window.player.getCurrentTime) {
        post('t:' + window.player.getCurrentTime().toFixed(3));
      }
    } catch (e) {}
  }
  window.onYouTubeIframeAPIReady = function() {
    if (!VIDEO_ID) { showErr('no-video-id'); return; }
    try {
      window.player = new YT.Player('yt', {
        width: '100%',
        height: '100%',
        videoId: VIDEO_ID,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { rel: 0, playsinline: 1, cc_load_policy: 0 },
        events: {
          onReady: function() {
            post('ready');
            try { window.player.playVideo(); } catch (e) {}
            setInterval(tick, 250);
          },
          onStateChange: function(e) { post('state:' + e.data); },
          onError: function(e) { showErr(e.data); }
        }
      });
    } catch (e) { showErr(-1); }
  };
})();
</script>
</body>
</html>
